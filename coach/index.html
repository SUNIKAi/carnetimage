<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#121110">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap">
<style>
:root{
  --noir:#121110; --surface:#1B1917; --surface-haut:#252120; --ligne:#332E2B;
  --rouge:#CC2200; --rouge-vif:#FF4A1F; --texte:#F4F0EC; --faible:#8B827B;
  --tres-faible:#5E5751; --vert:#4A9B68; --ambre:#C8820A;
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--noir);color:var(--texte);
  font-family:'Kanit',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-weight:400;font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;}
.page{max-width:560px;margin:0 auto;padding-bottom:40px;}

.entete{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--noir);
  padding-block:14px 11px;border-bottom:1px solid var(--ligne);margin-bottom:16px;}
.fil{display:flex;align-items:center;gap:7px;margin-bottom:3px;}
.pastille{width:6px;height:6px;border-radius:50%;background:var(--rouge);flex:none;}
.sur{font-size:10px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;color:var(--faible);}
h1{font-size:24px;font-weight:800;margin:0;letter-spacing:-.3px;}
.sous{font-size:12px;color:var(--faible);margin-top:2px;}

/* ---------- liste des élèves ---------- */
.eleve{width:100%;text-align:left;display:block;background:var(--surface);border:1px solid var(--ligne);
  border-radius:12px;padding:12px 13px;margin-bottom:9px;font-family:inherit;color:var(--texte);cursor:pointer;}
.eleve:active{background:var(--surface-haut);}
.e-haut{display:flex;align-items:center;gap:9px;}
.e-nom{font-size:16px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.badge{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 7px;border-radius:5px;
  background:var(--surface-haut);color:var(--faible);flex:none;}
.badge.online{color:var(--vert);background:rgba(74,155,104,.14);}
.badge.template{color:var(--ambre);background:rgba(200,130,10,.14);}
.e-bas{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px;}
.puce{font-size:11px;color:var(--faible);font-variant-numeric:tabular-nums;}
.puce b{color:var(--texte);font-weight:600;}
.alerte{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:3px 7px;
  border-radius:5px;background:rgba(204,34,0,.16);color:var(--rouge-vif);}
.alerte.douce{background:rgba(200,130,10,.14);color:var(--ambre);}
.jauge{height:4px;background:var(--ligne);border-radius:3px;overflow:hidden;margin-top:9px;}
.jauge span{display:block;height:100%;background:var(--rouge);width:0;}
.jauge.plein span{background:var(--vert);}

/* ---------- fiche élève ---------- */
.fiche{position:fixed;inset:0;z-index:20;background:var(--noir);overflow-y:auto;
  padding:0 max(16px,env(safe-area-inset-left,0px));}
.fiche[hidden]{display:none!important;}
.fiche-inner{max-width:560px;margin:0 auto;padding-block:22px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));}
.retour{background:none;border:none;color:var(--faible);font-family:inherit;font-size:12px;font-weight:600;
  letter-spacing:1px;text-transform:uppercase;padding:0 0 12px;cursor:pointer;}
.f-nom{font-size:25px;font-weight:800;margin:0;}
.f-sous{font-size:12px;color:var(--faible);margin:2px 0 16px;}
.liens{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px;}
.lien{min-height:40px;display:inline-flex;align-items:center;padding:0 12px;border-radius:9px;
  border:1px solid var(--ligne);background:var(--surface);color:var(--texte);font-family:inherit;
  font-size:12px;font-weight:600;letter-spacing:.6px;cursor:pointer;text-decoration:none;}
.lien:active{background:var(--surface-haut);}
.jour-titre{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--faible);
  margin:18px 0 8px;display:flex;align-items:center;gap:8px;}
.jour-titre .n{flex:1;min-width:0;}
.ex{background:var(--surface);border:1px solid var(--ligne);border-radius:10px;padding:10px 12px;margin-bottom:7px;}
.ex.faite{border-color:rgba(74,155,104,.4);}
.ex-haut{display:flex;align-items:baseline;gap:8px;}
.ex-nom{font-size:14.5px;font-weight:600;flex:1;min-width:0;}
.ex-ch{font-size:14px;font-weight:800;color:var(--rouge-vif);font-variant-numeric:tabular-nums;flex:none;}
.ex-bas{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;font-size:11.5px;color:var(--faible);font-variant-numeric:tabular-nums;}
.ex-bas .tech{color:var(--ambre);}
.perfs{margin-top:22px;}
.pligne{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--ligne);}
.pligne .g{min-width:0;}
.pligne .d{font-size:10.5px;color:var(--tres-faible);}
.pligne .e{font-size:13px;}
.pligne .s{font-size:13px;font-variant-numeric:tabular-nums;text-align:right;color:var(--faible);}
.msg{padding:50px 0;text-align:center;color:var(--faible);}
.msg h2{font-size:18px;font-weight:600;color:var(--texte);margin:0 0 8px;}
.msg p{margin:0 auto;max-width:320px;font-size:13.5px;line-height:1.6;}
/* ---------- éditeur de programme ---------- */
.edit{position:fixed;inset:0;z-index:21;background:var(--noir);overflow-y:auto;
  padding:0 max(16px,env(safe-area-inset-left,0px));}
.edit[hidden]{display:none!important;}
.edit-inner{max-width:560px;margin:0 auto;padding-block:22px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));}
.progs{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.prog{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:9px 11px;border-radius:9px;
  background:var(--surface);border:1px solid var(--ligne);}
.prog.actif{border-color:var(--vert);}
.prog .n{flex:1 1 100%;min-width:0;font-size:13.5px;}
.prog .meta{margin-right:auto;}
.prog .meta{font-size:10.5px;color:var(--tres-faible);flex:none;}
.mini{min-height:30px;padding:0 9px;border-radius:7px;border:1px solid var(--ligne);background:var(--surface-haut);
  color:var(--faible);font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:.6px;
  text-transform:uppercase;cursor:pointer;flex:none;}
.mini:active{background:var(--ligne);}
.mini.danger{color:var(--rouge-vif);}
.mini.vert{color:var(--vert);}
.jbloc{margin-bottom:14px;}
.jtete{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.jtete .t{flex:1;min-width:0;font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--faible);}
.ligne{display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:9px;
  background:var(--surface);border:1px solid var(--ligne);margin-bottom:5px;}
.ligne .nm{flex:1;min-width:0;font-size:13.5px;line-height:1.25;overflow-wrap:anywhere;}
.ligne .ms{font-size:10px;color:var(--tres-faible);text-transform:uppercase;letter-spacing:.6px;}
.serie-pm{display:flex;align-items:center;gap:4px;flex:none;}
.serie-pm button{width:28px;height:28px;border-radius:6px;border:1px solid var(--ligne);
  background:var(--surface-haut);color:var(--texte);font-family:inherit;font-size:15px;cursor:pointer;line-height:1;}
.serie-pm .v{min-width:40px;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--faible);}
.fleches{display:flex;flex-direction:column;gap:2px;flex:none;}
.fleches button{width:24px;height:16px;border-radius:4px;border:1px solid var(--ligne);
  background:var(--surface-haut);color:var(--faible);font-size:9px;line-height:1;cursor:pointer;padding:0;}
.barre-bas{position:fixed;left:0;right:0;bottom:0;z-index:23;
  background:linear-gradient(to top,var(--noir) 78%,rgba(18,17,16,0));
  padding:22px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));}
.barre-bas .in{max-width:560px;margin:0 auto;display:flex;gap:8px;}
.barre-bas button{flex:1;min-height:50px;border-radius:11px;border:none;font-family:inherit;
  font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;}
.b-annuler{background:var(--surface);color:var(--faible);box-shadow:inset 0 0 0 1px var(--ligne);}
.b-enreg{background:var(--rouge);color:#fff;}
.picker{position:fixed;inset:0;z-index:24;background:var(--noir);overflow-y:auto;padding:0 max(16px,env(safe-area-inset-left,0px));}
.picker[hidden]{display:none!important;}
.picker-inner{max-width:560px;margin:0 auto;padding-block:22px;}
.recherche{width:100%;min-height:46px;background:var(--surface);color:var(--texte);border:1px solid var(--ligne);
  border-radius:10px;padding:0 12px;font-family:inherit;font-size:15px;margin-bottom:12px;}
.recherche:focus{outline:none;border-color:var(--rouge);}
.px{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:9px;
  background:var(--surface);border:1px solid var(--ligne);margin-bottom:5px;font-family:inherit;color:var(--texte);cursor:pointer;}
.px img{width:36px;height:36px;border-radius:6px;object-fit:cover;background:#fff;flex:none;}
.px .nm{flex:1;min-width:0;font-size:13.5px;}
.px .ms{font-size:10px;color:var(--tres-faible);text-transform:uppercase;}
.avert{font-size:11.5px;color:var(--ambre);background:rgba(200,130,10,.1);border-left:2px solid var(--ambre);
  padding:8px 10px;border-radius:7px;margin-bottom:14px;line-height:1.5;}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));
  background:var(--surface-haut);border:1px solid var(--ligne);border-radius:9px;padding:9px 14px;
  font-size:12.5px;z-index:30;box-shadow:0 6px 22px rgba(0,0,0,.5);}
.toast[hidden]{display:none!important;}
button:focus-visible{outline:2px solid var(--rouge-vif);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<div class="page">
  <header class="entete" id="entete" hidden>
    <div class="fil"><span class="pastille"></span><span class="sur" id="hSem"></span></div>
    <h1>Mes élèves</h1>
    <div class="sous" id="hSous"></div>
  </header>
  <main id="liste"><div class="msg"><h2>Chargement…</h2><p>Lecture de la base.</p></div></main>
</div>

<div class="fiche" id="fiche" hidden>
  <div class="fiche-inner">
    <button class="retour" id="retour" type="button">← Mes élèves</button>
    <h2 class="f-nom" id="fNom"></h2>
    <div class="f-sous" id="fSous"></div>
    <div class="liens" id="fLiens"></div>
    <div id="fProg"></div>
    <div class="perfs" id="fPerfs"></div>
  </div>
</div>

<div class="edit" id="edit" hidden>
  <div class="edit-inner">
    <button class="retour" id="edRetour" type="button">← Fiche de l'élève</button>
    <h2 class="f-nom" id="edNom"></h2>
    <div class="f-sous">Ses programmes</div>
    <div class="progs" id="edProgs"></div>
    <div class="liens"><button class="lien" id="edNouveau" type="button">+ Nouveau programme</button></div>
    <div class="avert">Les charges affichées aux élèves sont recalculées par <b>prescrire.py</b>. Après une modification ici, elles restent celles de la semaine passée jusqu'à son prochain passage.</div>
    <div id="edJours"></div>
    <div class="liens"><button class="lien" id="edAjJour" type="button">+ Ajouter un jour</button></div>
  </div>
  <div class="barre-bas" id="edBarre" hidden>
    <div class="in">
      <button class="b-annuler" id="edAnnuler" type="button">Annuler</button>
      <button class="b-enreg" id="edEnreg" type="button">Enregistrer</button>
    </div>
  </div>
</div>

<div class="picker" id="picker" hidden>
  <div class="picker-inner">
    <button class="retour" id="pkRetour" type="button">← Annuler</button>
    <input class="recherche" id="pkQ" type="search" placeholder="Chercher un exercice, un muscle…" autocomplete="off" autocapitalize="off">
    <div id="pkListe"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(function(){
  "use strict";
  var API='https://aghftupaybcffvtzibds.supabase.co/rest/v1/rpc/';
  var CLE='sb_publishable_vqFJ7bgqNbAtXfFFkAeSTg_diGfjPjz';
  var BASE_SEANCE='https://sunikai.com/carnetimage/seance/#';

  var jeton=(location.hash||'').replace(/[^A-Za-z0-9_-]/g,'');
  try{
    if(jeton) localStorage.setItem('coach-jeton',jeton);
    else jeton=localStorage.getItem('coach-jeton')||'';
  }catch(e){}

  var DATA=null;
  var $=function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function nb(x){ return (+x).toString(); }

  function appeler(f,args){
    return fetch(API+f,{method:'POST',
      headers:{'apikey':CLE,'Authorization':'Bearer '+CLE,'Content-Type':'application/json'},
      body:JSON.stringify(args)})
      .then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error(r.status+' '+t); }); return r.json(); });
  }

  function toast(txt){
    var t=$('toast'); t.textContent=txt; t.hidden=false;
    var barre=$('edBarre');                      // ne pas se poser SOUS la barre d'enregistrement
    t.style.bottom=(barre&&!barre.hidden)?'calc(86px + env(safe-area-inset-bottom,0px))':'';
    clearTimeout(t._t); t._t=setTimeout(function(){ t.hidden=true; },2200);
  }

  function joursDepuis(d){
    if(!d) return null;
    return Math.floor((Date.now()-new Date(d+'T00:00:00').getTime())/86400000);
  }

  // ---------- liste ----------
  function rendre(){
    $('entete').hidden=false;
    $('hSem').textContent='Semaine '+DATA.semaine+(DATA.intensity?' · '+DATA.intensity:'')+
                          (DATA.technique?' · '+DATA.technique:'');
    var actifs=DATA.eleves.filter(function(e){ return e.etat!=='ARCHIVE'; });
    $('hSous').textContent=actifs.length+' élève'+(actifs.length>1?'s':'');

    if(!DATA.eleves.length){
      $('liste').innerHTML='<div class="msg"><h2>Aucun élève</h2><p>La base ne contient encore personne.</p></div>';
      return;
    }
    $('liste').innerHTML=DATA.eleves.map(function(e){
      var j=joursDepuis(e.derniere_seance);
      var al='';
      if(j===null) al='<span class="alerte">jamais entraîné</span>';
      else if(j>=10) al='<span class="alerte">'+j+' jours sans séance</span>';
      else if(j>=5) al='<span class="alerte douce">'+j+' jours</span>';
      if(!e.programme) al+='<span class="alerte">aucun programme</span>';
      var part=e.series_prevues?Math.min(100,Math.round(e.series_semaine/e.series_prevues*100)):0;
      var cls=e.etat==='ONLINE'?'online':(e.etat==='TEMPLATE'?'template':'');
      return '<button class="eleve" type="button" data-id="'+e.id+'">'+
        '<div class="e-haut"><span class="e-nom">'+esc(e.nom)+'</span>'+
          '<span class="badge '+cls+'">'+esc(e.etat||'')+'</span></div>'+
        '<div class="e-bas">'+
          '<span class="puce"><b>'+e.series_semaine+'</b>/'+e.series_prevues+' séries cette semaine</span>'+
          (j!==null?'<span class="puce">· dernière il y a <b>'+j+'</b> j</span>':'')+
          al+
        '</div>'+
        '<div class="jauge'+(part>=100?' plein':'')+'"><span style="width:'+part+'%"></span></div>'+
      '</button>';
    }).join('');
  }

  $('liste').addEventListener('click',function(ev){
    var b=ev.target.closest('[data-id]');
    if(b) ouvrirFiche(b.dataset.id);
  });

  // ---------- fiche ----------
  function ouvrirFiche(id){
    $('fiche').hidden=false; window.scrollTo(0,0);
    $('fNom').textContent='…'; $('fSous').textContent=''; $('fProg').innerHTML='';
    $('fPerfs').innerHTML=''; $('fLiens').innerHTML='';
    appeler('eleve_detail',{p_jeton:jeton,p_eleve:id}).then(function(d){
      $('fNom').textContent=d.nom;
      $('fSous').textContent=[d.etat,d.planification,d.lang,d.programme||'aucun programme']
        .filter(Boolean).join(' · ');

      var lien=BASE_SEANCE+d.jeton;
      $('fLiens').innerHTML=
        '<a class="lien" href="'+esc(lien)+'" target="_blank" rel="noopener">Ouvrir sa séance ↗</a>'+
        '<button class="lien" type="button" id="copier">Copier son lien</button>'+
        '<button class="lien" type="button" id="modifier">Modifier son programme</button>';
      $('modifier').addEventListener('click',function(){ ouvrirEditeur(id,d.nom); });
      $('copier').addEventListener('click',function(){
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(lien).then(function(){ toast('Lien copié'); })
            .catch(function(){ toast(lien); });
        }else toast(lien);
      });

      $('fProg').innerHTML=(d.jours||[]).map(function(j){
        var faits=j.exos.filter(function(x){ return x.faite_semaine; }).length;
        return '<div class="jour-titre"><span class="n">Day '+esc(j.num)+' — '+esc(j.titre||'')+'</span>'+
               '<span>'+faits+'/'+j.exos.length+'</span></div>'+
          j.exos.map(function(x){
            var p=x.prescription||{};
            var der=x.derniere&&x.derniere.series&&x.derniere.series.length
              ? x.derniere.series.map(function(z){return nb(z.charge)+'×'+z.reps;}).join(' · ')+' '+(x.derniere.unite||'').toLowerCase()
              : 'aucun historique';
            return '<div class="ex'+(x.faite_semaine?' faite':'')+'">'+
              '<div class="ex-haut"><span class="ex-nom">'+(x.faite_semaine?'✓ ':'')+esc(x.nom)+'</span>'+
                (p.objectif?'<span class="ex-ch">'+esc(p.objectif.split(/\s*\(/)[0])+'</span>':'')+'</div>'+
              '<div class="ex-bas">'+
                '<span>'+x.series+' × '+esc((p.format||'').split(/\s+-\s+/)[0].replace(/^\d+\s*x\s*/i,'')||'?')+'</span>'+
                (p.technique?'<span class="tech">'+esc(p.technique)+'</span>':'')+
                '<span>'+esc(der)+'</span>'+
              '</div></div>';
          }).join('');
      }).join('');

      $('fPerfs').innerHTML='<div class="jour-titre">Dernières performances</div>'+
        ((d.dernieres_perfs||[]).map(function(p){
          var s=(p.series||[]).map(function(z){return nb(z.charge)+'×'+z.reps;}).join(' · ');
          var dt=new Date(p.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});
          return '<div class="pligne"><div class="g"><div class="e">'+esc(p.exercice)+'</div>'+
                 '<div class="d">'+dt+(p.technique?' · '+esc(p.technique):'')+'</div></div>'+
                 '<div class="s">'+esc(s)+' <small>'+(p.unite||'').toLowerCase()+'</small></div></div>';
        }).join('') || '<div class="msg"><p>Aucune performance enregistrée.</p></div>');
    }).catch(function(){
      $('fNom').textContent='Erreur';
      $('fSous').textContent='Impossible de charger cette fiche.';
    });
  }
  $('retour').addEventListener('click',function(){ $('fiche').hidden=true; });

  // ---------- éditeur de programme ----------
  // Reprend ce que faisait le Tracker V3 : les programmes d'un élève, celui qui
  // est actif, et son contenu remplacé d'un bloc à l'enregistrement (c'est aussi
  // ce que fait maj_programme côté base, qui recalcule au passage les titres de
  // jour depuis les muscles dominants).
  var EXOS=null;   // les 117 exercices, lus une seule fois
  var ED=null;     // {eleve, nom, progs, pid, jours:[{num,titre,exos}], sale}
  var PK_JOUR=null;

  function ouvrirEditeur(id,nom){
    $('edit').hidden=false; window.scrollTo(0,0);
    $('edNom').textContent=nom;
    $('edProgs').innerHTML='<div class="prog"><span class="n">Lecture…</span></div>';
    $('edJours').innerHTML=''; $('edBarre').hidden=true;
    ED={eleve:id,nom:nom,progs:[],pid:null,jours:[],sale:false};
    var att=[appeler('programmes_eleve',{p_jeton:jeton,p_eleve:id})];
    if(!EXOS) att.push(appeler('liste_exercices',{p_jeton:jeton}));
    Promise.all(att).then(function(r){
      ED.progs=r[0]||[];
      if(r[1]) EXOS=r[1];
      var a=ED.progs.filter(function(x){ return x.actif; })[0]||ED.progs[0];
      if(a) charger(a.id); else rendreEd();
    }).catch(panneEd);
  }
  function panneEd(){ $('edProgs').innerHTML='<div class="prog"><span class="n">Lecture impossible.</span></div>'; }

  function charger(pid){
    ED.pid=pid; ED.sale=false;
    $('edJours').innerHTML='<div class="msg"><p>Lecture du programme…</p></div>';
    appeler('programme_contenu',{p_jeton:jeton,p_programme:pid}).then(function(l){
      var par={};
      (l||[]).forEach(function(x){
        if(!par[x.jour]) par[x.jour]={num:x.jour,titre:x.titre_jour,exos:[]};
        par[x.jour].exos.push({exercice_id:x.exercice_id,nom:x.nom,muscle:x.muscle,series:x.series});
      });
      ED.jours=Object.keys(par).sort(function(a,b){ return a-b; }).map(function(k){ return par[k]; });
      rendreEd();
    }).catch(panneEd);
  }

  function renumeroter(){ ED.jours.forEach(function(j,i){ j.num=i+1; }); }
  function salir(){ ED.sale=true; }

  function rendreEd(){
    $('edProgs').innerHTML=ED.progs.map(function(p){
      var ouvert=p.id===ED.pid;
      return '<div class="prog'+(p.actif?' actif':'')+'">'+
        '<button class="mini" data-voir="'+p.id+'" type="button" style="flex:1 1 100%;text-align:left;border:none;'+
          'background:none;padding:0;font-size:13.5px;text-transform:none;letter-spacing:0;color:'+
          (ouvert?'var(--texte)':'var(--faible)')+'">'+(ouvert?'▸ ':'')+esc(p.nom)+'</button>'+
        '<span class="meta">'+p.jours+'j · '+p.exos+'ex</span>'+
        (p.actif?'<span class="mini vert">actif</span>'
                :'<button class="mini" data-act="'+p.id+'" type="button">activer</button>')+
        '<button class="mini" data-ren="'+p.id+'" type="button">nom</button>'+
        '<button class="mini" data-dup="'+p.id+'" type="button">copier</button>'+
        '<button class="mini danger" data-sup="'+p.id+'" type="button">suppr</button>'+
      '</div>';
    }).join('')||'<div class="prog"><span class="n">Aucun programme pour cet élève.</span></div>';

    var total=0;
    $('edJours').innerHTML=ED.jours.map(function(j,ij){
      total+=j.exos.length;
      return '<div class="jbloc"><div class="jtete">'+
          '<span class="t">Day '+j.num+(j.titre?' — '+esc(j.titre):'')+'</span>'+
          '<button class="mini" data-aj="'+ij+'" type="button">+ exo</button>'+
          '<button class="mini danger" data-sj="'+ij+'" type="button">✕</button>'+
        '</div>'+
        (j.exos.map(function(x,ix){
          return '<div class="ligne">'+
            '<div class="fleches">'+
              '<button data-mv="'+ij+':'+ix+':-1" type="button" aria-label="monter">▲</button>'+
              '<button data-mv="'+ij+':'+ix+':1" type="button" aria-label="descendre">▼</button></div>'+
            '<span class="nm">'+esc(x.nom)+'<br><span class="ms">'+esc(x.muscle||'—')+'</span></span>'+
            '<span class="serie-pm">'+
              '<button data-sr="'+ij+':'+ix+':-1" type="button" aria-label="moins">−</button>'+
              '<span class="v">'+x.series+' sér.</span>'+
              '<button data-sr="'+ij+':'+ix+':1" type="button" aria-label="plus">+</button></span>'+
            '<button class="mini danger" data-rm="'+ij+':'+ix+'" type="button">✕</button>'+
          '</div>';
        }).join('')||'<div class="ligne"><span class="nm" style="color:var(--tres-faible)">Jour vide</span></div>')+
      '</div>';
    }).join('');

    $('edBarre').hidden=!ED.sale;
    $('edEnreg').textContent='Enregistrer · '+total+' ex';
  }

  function majListeProgs(){
    return appeler('programmes_eleve',{p_jeton:jeton,p_eleve:ED.eleve})
      .then(function(p){ ED.progs=p||[]; });
  }

  function actionProg(f,args,dit){
    appeler(f,args).then(function(){
      toast(dit);
      majListeProgs().then(rendreEd);
    }).catch(function(){ toast('Action refusée'); });
  }

  function siSale(suite){
    if(!ED.sale||confirm('Des modifications ne sont pas enregistrées. Les abandonner ?')) suite();
  }

  $('edit').addEventListener('click',function(ev){
    var b=ev.target.closest('button'); if(!b) return;
    var d=b.dataset, n, p, i;

    if(d.voir){ if(d.voir!==ED.pid) siSale(function(){ charger(d.voir); }); return; }
    if(d.act){ siSale(function(){ actionProg('activer_programme',
        {p_jeton:jeton,p_programme:d.act},'Programme activé'); }); return; }
    if(d.ren){
      p=ED.progs.filter(function(x){ return x.id===d.ren; })[0];
      n=prompt('Nouveau nom du programme :',p?p.nom:'');
      if(n&&n.trim()) actionProg('renommer_programme',
        {p_jeton:jeton,p_programme:d.ren,p_nom:n.trim()},'Renommé');
      return;
    }
    if(d.dup){
      p=ED.progs.filter(function(x){ return x.id===d.dup; })[0];
      n=prompt('Nom de la copie :',(p?p.nom:'Programme')+' (copie)');
      if(n&&n.trim()) actionProg('dupliquer_programme',
        {p_jeton:jeton,p_programme:d.dup,p_nom:n.trim()},'Copie créée');
      return;
    }
    if(d.sup){
      p=ED.progs.filter(function(x){ return x.id===d.sup; })[0];
      if(p&&p.actif){ toast('Active un autre programme avant de supprimer celui-ci'); return; }
      if(!confirm('Supprimer « '+(p?p.nom:'')+' » et tout son contenu ?')) return;
      appeler('supprimer_programme',{p_jeton:jeton,p_programme:d.sup}).then(function(){
        toast('Programme supprimé');
        majListeProgs().then(function(){
          if(ED.pid===d.sup){
            var a=ED.progs.filter(function(x){ return x.actif; })[0]||ED.progs[0];
            if(a) charger(a.id); else { ED.pid=null; ED.jours=[]; rendreEd(); }
          }else rendreEd();
        });
      }).catch(function(){ toast('Suppression refusée'); });
      return;
    }

    if(!ED.pid) return;   // ce qui suit demande un programme ouvert

    if(d.aj){ ouvrirPicker(+d.aj); return; }
    if(d.sj){
      i=+d.sj;
      if(!confirm('Supprimer le jour '+ED.jours[i].num+' et ses '+ED.jours[i].exos.length+' exercices ?')) return;
      ED.jours.splice(i,1); renumeroter(); salir(); rendreEd(); return;
    }
    if(d.mv){
      var m=d.mv.split(':'), ij=+m[0], ix=+m[1], pas=+m[2];
      var ex=ED.jours[ij].exos, cible=ix+pas;
      if(cible>=0&&cible<ex.length) ex.splice(cible,0,ex.splice(ix,1)[0]);
      else if(cible<0&&ij>0) ED.jours[ij-1].exos.push(ex.splice(ix,1)[0]);          // fin du jour d'avant
      else if(cible>=ex.length&&ij<ED.jours.length-1) ED.jours[ij+1].exos.unshift(ex.splice(ix,1)[0]);
      else return;
      salir(); rendreEd(); return;
    }
    if(d.sr){
      var s=d.sr.split(':'), e=ED.jours[+s[0]].exos[+s[1]];
      e.series=Math.max(1,Math.min(10,(e.series||4)+ +s[2]));
      salir(); rendreEd(); return;
    }
    if(d.rm){
      var r=d.rm.split(':');
      ED.jours[+r[0]].exos.splice(+r[1],1); salir(); rendreEd(); return;
    }
  });

  $('edNouveau').addEventListener('click',function(){
    var n=prompt('Nom du nouveau programme :','Programme '+ED.nom);
    if(!n||!n.trim()) return;
    appeler('creer_programme',{p_jeton:jeton,p_eleve:ED.eleve,p_nom:n.trim()}).then(function(r){
      toast('Programme créé');
      majListeProgs().then(function(){
        if(r&&r.id){ ED.pid=r.id; ED.jours=[{num:1,titre:'',exos:[]}]; ED.sale=false; }
        rendreEd();
      });
    }).catch(function(){ toast('Création refusée'); });
  });

  $('edAjJour').addEventListener('click',function(){
    if(!ED.pid){ toast('Crée ou ouvre un programme avant'); return; }
    ED.jours.push({num:ED.jours.length+1,titre:'',exos:[]});
    salir(); rendreEd();
    window.scrollTo(0,document.body.scrollHeight);
  });

  $('edAnnuler').addEventListener('click',function(){ siSale(function(){ charger(ED.pid); }); });
  $('edRetour').addEventListener('click',function(){
    siSale(function(){ $('edit').hidden=true; });
  });

  $('edEnreg').addEventListener('click',function(){
    var exos=[];
    ED.jours.forEach(function(j,ij){
      j.exos.forEach(function(x,ix){
        exos.push({jour:ij+1,ordre:ix+1,exercice_id:x.exercice_id,series:x.series});
      });
    });
    if(!exos.length){ toast('Un programme sans exercice ne peut pas être enregistré'); return; }
    $('edEnreg').disabled=true;
    appeler('maj_programme',{p_jeton:jeton,p_programme:ED.pid,p_exos:exos}).then(function(r){
      $('edEnreg').disabled=false;
      toast((r&&r.exercices!=null?r.exercices:exos.length)+' exercices enregistrés');
      majListeProgs().then(function(){ charger(ED.pid); });   // relit les titres de jour recalculés
    }).catch(function(){
      $('edEnreg').disabled=false; toast('Enregistrement refusé');
    });
  });

  // ---------- choix d'un exercice ----------
  function ouvrirPicker(ij){
    PK_JOUR=ij; $('picker').hidden=false; $('pkQ').value=''; rendrePicker('');
    setTimeout(function(){ try{ $('pkQ').focus(); }catch(e){} },60);
  }
  function rendrePicker(q){
    q=(q||'').toLowerCase().trim();
    var l=(EXOS||[]).filter(function(x){
      return !q || (x.nom||'').toLowerCase().indexOf(q)>=0 || (x.muscle||'').toLowerCase().indexOf(q)>=0;
    });
    var coupe=l.slice(0,60);
    if(!l.length){ $('pkListe').innerHTML='<div class="msg"><p>Aucun exercice ne correspond.</p></div>'; return; }
    $('pkListe').innerHTML=coupe.map(function(x){
      return '<button class="px" type="button" data-add="'+x.id+'">'+
        (x.image?'<img src="'+esc(x.image)+'" alt="" loading="lazy">':'<img alt="">')+
        '<span class="nm">'+esc(x.nom)+'<br><span class="ms">'+esc(x.muscle||'—')+
          ' · '+esc((x.type||'').toLowerCase())+'</span></span></button>';
    }).join('')+(l.length>coupe.length
      ?'<div class="msg"><p>'+(l.length-coupe.length)+' autres — précise ta recherche.</p></div>':'');
  }
  $('pkQ').addEventListener('input',function(){ rendrePicker(this.value); });
  $('pkRetour').addEventListener('click',function(){ $('picker').hidden=true; });
  $('pkListe').addEventListener('click',function(ev){
    var b=ev.target.closest('[data-add]'); if(!b) return;
    var x=(EXOS||[]).filter(function(y){ return y.id===b.dataset.add; })[0];
    if(!x||PK_JOUR==null) return;
    var j=ED.jours[PK_JOUR];
    var def=j.exos.length?j.exos[j.exos.length-1].series:4;   // mêmes séries que le précédent
    j.exos.push({exercice_id:x.id,nom:x.nom,muscle:x.muscle,series:def});
    $('picker').hidden=true; salir(); rendreEd();
    toast(x.nom+' ajouté au jour '+j.num);
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }

  // ---------- chargement ----------
  if(!jeton){
    $('liste').innerHTML='<div class="msg"><h2>Lien incomplet</h2>'+
      '<p>Ouvre le lien coach complet : il se termine par un code après le #.</p></div>';
    return;
  }
  appeler('tableau_coach',{p_jeton:jeton}).then(function(d){ DATA=d; rendre(); })
    .catch(function(e){
      $('liste').innerHTML='<div class="msg"><h2>Accès refusé</h2>'+
        '<p>Ce lien coach n\'est pas valide. Vérifie le code après le #.</p></div>';
    });
})();
</script>
</body>
</html>
