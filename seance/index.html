<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet de séance</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#121110">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Séance">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap">
<style>
:root{
  --noir:#121110; --surface:#1B1917; --surface-haut:#252120; --ligne:#332E2B;
  --rouge:#CC2200; --rouge-vif:#FF4A1F; --texte:#F4F0EC; --faible:#8B827B;
  --tres-faible:#5E5751; --vert:#4A9B68; --ambre:#C8820A;
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--noir);color:var(--texte);
  font-family:'Kanit',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-weight:400;font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
}
.page{max-width:460px;margin:0 auto;padding-bottom:24px;}
body.chrono-actif .page{padding-bottom:104px;}

/* ---------- entête ---------- */
.entete{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--noir);
  padding-block:14px 0;border-bottom:1px solid var(--ligne);margin-bottom:16px;}
.fil{display:flex;align-items:center;gap:7px;margin-bottom:4px;flex-wrap:wrap;}
.pastille{width:6px;height:6px;border-radius:50%;background:var(--rouge);flex:none;}
.semaine{font-size:10px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;color:var(--faible);}
.jour{font-size:24px;font-weight:800;letter-spacing:-.3px;margin:0;line-height:1.15;}
.sous-jour{font-size:12px;color:var(--faible);margin-top:2px;}
.onglets{display:flex;gap:6px;margin-top:11px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px;}
.onglets::-webkit-scrollbar{display:none;}
.onglet{flex:none;min-height:36px;padding:0 13px;border-radius:8px;border:1px solid var(--ligne);
  background:var(--surface);color:var(--faible);font-family:inherit;font-size:12px;font-weight:600;
  letter-spacing:.8px;text-transform:uppercase;cursor:pointer;white-space:nowrap;}
.onglet[aria-selected="true"]{background:var(--rouge);border-color:var(--rouge);color:#fff;}
.onglet .pt{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--vert);margin-left:6px;vertical-align:middle;}
.barre{height:3px;background:var(--ligne);border-radius:2px;overflow:hidden;margin-bottom:-1px;}
.barre span{display:block;height:100%;background:var(--rouge);width:0;transition:width .35s ease;}

/* ---------- séance terminée ---------- */
.verrou{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:12px 13px;
  border-radius:11px;background:rgba(74,155,104,.12);border:1px solid rgba(74,155,104,.4);}
.verrou .ok{font-size:19px;line-height:1;}
.verrou .txt{flex:1;min-width:0;}
.verrou .t{font-size:14px;font-weight:600;color:var(--vert);}
.verrou .d{font-size:11.5px;color:var(--faible);margin-top:1px;}
.verrou button{min-height:38px;padding:0 13px;border-radius:8px;border:1px solid var(--ligne);
  background:var(--surface);color:var(--texte);font-family:inherit;font-size:12px;font-weight:600;
  letter-spacing:.8px;text-transform:uppercase;cursor:pointer;flex:none;}
.jour-verrouille .exo{opacity:.62;}
.jour-verrouille input,.jour-verrouille .valider,.jour-verrouille .outil,
.jour-verrouille .unite-bascule{pointer-events:none;}

/* ---------- exercice ---------- */
.exo{background:var(--surface);border:1px solid var(--ligne);border-radius:13px;margin-bottom:13px;overflow:hidden;transition:border-color .25s;}
.exo.fait{border-color:rgba(74,155,104,.45);}
.exo-tete{display:flex;gap:11px;padding:14px 14px 11px;align-items:flex-start;}
.num{width:26px;height:26px;border-radius:7px;background:var(--surface-haut);color:var(--faible);
  font-size:12px;font-weight:800;flex:none;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;}
.exo.fait .num{background:rgba(74,155,104,.18);color:var(--vert);}
.exo-titres{flex:1;min-width:0;}
.exo-nom{font-size:17px;font-weight:600;line-height:1.2;margin:0;}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center;}
.tag{font-size:9.5px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--surface-haut);color:var(--faible);}
.tag.tech{color:var(--ambre);background:rgba(200,130,10,.12);}
.tag.repos{cursor:pointer;border:1px solid var(--ligne);color:var(--texte);}
.tag.repos:active{background:var(--ligne);}
.pdc-tag{text-transform:uppercase;letter-spacing:.5px;}
.serie.pdc .champ{flex:1;}
.unite-bascule{display:inline-flex;border:1px solid var(--ligne);border-radius:5px;overflow:hidden;}
.unite-bascule button{border:none;background:var(--surface-haut);color:var(--tres-faible);
  font-family:inherit;font-size:9.5px;font-weight:700;letter-spacing:1px;padding:3px 8px;cursor:pointer;min-height:22px;}
.unite-bascule button[aria-pressed="true"]{background:var(--rouge);color:#fff;}

/* ---------- carte du coach ----------
   Plus de contrainte d'image : l'information utile en salle passe devant.
   La charge en grand, le plan des séries en chiffres réels, la pédagogie repliée. */
.carte{margin:0 14px 12px;border:1px solid var(--ligne);border-radius:12px;overflow:hidden;background:var(--surface-haut);}
.c-haut{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--ligne);}
/* En-tete : la technique, cliquable, son schema a droite. L'explication est
   repliee dessous — on la lit une fois, on la connait ensuite. */
.c-tete{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;
  background:transparent;border:none;border-bottom:1px solid var(--ligne);
  font-family:inherit;text-align:left;cursor:pointer;}
.c-tete:active{background:var(--ligne);}
.c-tete.fixe{cursor:default;}
/* la fleche se colle au nom ; c'est elle qui repousse le schema a droite */
.c-tete .c-tech{flex:0 1 auto;}
.c-tete .fl{font-size:11px;color:var(--rouge-vif);flex:none;margin-right:auto;opacity:.75;}
.carte.test .c-tete .fl{color:var(--ambre);}
.c-tete .mini{flex:none;width:72px;opacity:.9;}
.c-tete .mini svg{width:100%;height:auto;display:block;}
.c-tete .mini .lbl{display:none;}
.c-expli{padding:10px 12px;border-bottom:1px solid var(--ligne);
  font-size:12.5px;color:var(--faible);line-height:1.5;}
.c-expli[hidden]{display:none!important;}
.c-expli .sous{font-size:9px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--tres-faible);margin-top:6px;}
/* Les deux informations qui comptent en salle : le format, puis l'objectif. */
.c-info{padding:10px 12px 0;}
.c-info:last-of-type{padding-bottom:12px;}
.c-info .lbl{display:block;font-size:9.5px;font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--tres-faible);margin-bottom:3px;}
.c-info .v{font-size:13.5px;color:var(--texte);font-variant-numeric:tabular-nums;}
.c-obj .c-charge{padding:2px 0 0;}
.c-obj .c-plan{padding:8px 0 0;}
.c-tech{font-size:11.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--rouge-vif);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.c-fmt{font-size:12px;font-weight:600;color:var(--faible);font-variant-numeric:tabular-nums;flex:none;}
.c-charge{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;padding:12px 12px 4px;}
.c-val{font-size:38px;font-weight:800;line-height:.95;color:var(--rouge-vif);font-variant-numeric:tabular-nums;letter-spacing:-1px;}
.c-val .u{font-size:17px;font-weight:600;margin-left:3px;letter-spacing:0;}
.c-alt{font-size:13px;font-weight:600;color:var(--tres-faible);font-variant-numeric:tabular-nums;}
.c-reps{font-size:15px;font-weight:600;color:var(--texte);margin-left:auto;font-variant-numeric:tabular-nums;}
.carte.test .c-val,.carte.test .c-tech{color:var(--ambre);}
.c-plan{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:6px 12px 12px;}
.c-plan .lbl{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--tres-faible);margin-right:2px;}
.chip{min-width:38px;text-align:center;padding:4px 8px;border-radius:7px;font-size:13px;font-weight:700;
  font-variant-numeric:tabular-nums;background:rgba(204,34,0,.16);color:var(--rouge-vif);
  box-shadow:inset 0 0 0 1px rgba(204,34,0,.4);}
.chip.rampe{background:transparent;color:var(--faible);box-shadow:inset 0 0 0 1px var(--ligne);}
.c-plus{width:100%;border:none;border-top:1px solid var(--ligne);background:transparent;color:var(--tres-faible);
  font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  padding:9px 12px;cursor:pointer;text-align:left;}
.c-plus:active{background:var(--ligne);}
.c-detail{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px;}
.c-detail[hidden]{display:none!important;}
.c-bloc{display:flex;gap:10px;align-items:flex-start;}
.c-bloc .schema{flex:none;width:96px;opacity:.9;}
.c-bloc .schema svg{width:100%;height:auto;display:block;}
.c-bloc .schema .lbl{font-size:8px;letter-spacing:1.1px;text-transform:uppercase;color:var(--tres-faible);text-align:center;margin-top:2px;}
.philo{font-size:12px;color:var(--faible);line-height:1.5;flex:1;min-width:0;}
.c-ligne{font-size:12.5px;color:var(--faible);line-height:1.5;}
.c-ligne b{color:var(--texte);font-weight:600;display:block;font-size:9.5px;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--tres-faible);margin-bottom:2px;}
.c-ligne .v{font-variant-numeric:tabular-nums;color:var(--texte);}

/* ---------- abdos ----------
   Un bloc court en fin de seance : la consigne de la semaine, les exercices
   au choix, et une seule ligne a remplir. Il n'apparait que si le coach a
   active les abdos pour cet eleve. */
.abdo{margin:18px 14px 8px;border:1px solid var(--ligne);border-radius:12px;
  background:var(--surface-haut);overflow:hidden;}
.abdo-tete{padding:11px 12px;border-bottom:1px solid var(--ligne);}
.abdo-sur{display:block;font-size:9.5px;font-weight:800;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--tres-faible);margin-bottom:3px;}
.abdo-nom{font-size:14px;font-weight:800;letter-spacing:.4px;
  text-transform:uppercase;color:var(--rouge-vif);}
.abdo-consigne{margin:0;padding:10px 12px;font-size:12.5px;line-height:1.5;
  color:var(--faible);border-bottom:1px solid var(--ligne);}
.abdo-choix{display:flex;flex-wrap:wrap;gap:6px;padding:11px 12px;}
.abdo-x{padding:7px 10px;border-radius:8px;border:1px solid var(--ligne);
  background:var(--surface);color:var(--faible);font-family:inherit;
  font-size:11.5px;font-weight:600;cursor:pointer;}
.abdo-x[aria-pressed="true"]{background:rgba(204,34,0,.16);color:var(--rouge-vif);
  border-color:var(--rouge);}
.abdo-bas{display:flex;gap:7px;padding:0 12px 12px;}
.abdo-bas input{flex:1;min-width:0;min-height:46px;background:var(--surface);
  color:var(--texte);border:1px solid var(--ligne);border-radius:10px;
  padding:0 12px;font-family:inherit;font-size:15px;}
.abdo-bas input:focus{outline:none;border-color:var(--rouge);}
.abdo-bas button{flex:none;min-height:46px;padding:0 16px;border-radius:10px;
  border:none;background:var(--rouge);color:#fff;font-family:inherit;
  font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
  cursor:pointer;}
.abdo.fait .abdo-nom::after{content:" ✓";color:var(--vert);}

/* ---------- séries ---------- */
.series{padding:0 14px 4px;display:flex;flex-direction:column;gap:6px;}
.serie{display:flex;align-items:center;gap:7px;}
.serie-num{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--tres-faible);width:26px;flex:none;text-transform:uppercase;}
.serie-role{font-size:8px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--tres-faible);display:block;margin-top:1px;}
.serie.rampe .serie-role{color:var(--ambre);}
.champ{position:relative;flex:1;min-width:0;}
.champ input{width:100%;min-height:46px;background:var(--noir);color:var(--texte);border:1px solid var(--ligne);
  border-radius:9px;padding:0 34px 0 11px;font-family:inherit;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;}
.champ input::placeholder{color:var(--tres-faible);font-weight:400;}
.champ input:focus{outline:none;border-color:var(--rouge);}
.champ .unite{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:600;color:var(--tres-faible);text-transform:uppercase;pointer-events:none;}
.valider{width:46px;height:46px;flex:none;border-radius:9px;border:1px solid var(--ligne);background:var(--surface-haut);
  color:var(--faible);cursor:pointer;font-size:17px;line-height:1;transition:transform .12s;}
.valider:active{transform:scale(.94);}
.serie.ok .valider{background:var(--vert);border-color:var(--vert);color:#fff;}
.serie.ok .champ input{color:var(--faible);border-color:transparent;background:transparent;}

/* ---------- aide à la saisie ---------- */
.aide{display:flex;flex-wrap:wrap;gap:5px;padding:2px 0 4px 33px;}
.aide button{min-height:36px;padding:0 11px;border-radius:8px;border:1px solid var(--ligne);
  background:var(--surface-haut);color:var(--texte);font-family:inherit;font-size:13px;font-weight:600;
  cursor:pointer;font-variant-numeric:tabular-nums;}
.aide button:active{background:var(--ligne);}
.aide button.cible{border-color:var(--rouge);color:var(--rouge-vif);}
.aide button.toutes{color:var(--faible);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;}

/* ---------- outils ---------- */
.outils{display:flex;flex-direction:column;gap:7px;padding:4px 14px 14px;}
.outil{width:100%;min-height:42px;border-radius:8px;border:1px solid var(--ligne);background:var(--surface-haut);
  color:var(--faible);font-family:inherit;font-size:12px;font-weight:600;letter-spacing:.8px;
  text-transform:uppercase;cursor:pointer;text-align:left;padding:0 12px;}
.outil:active{background:var(--ligne);}
.outil.retour{border-color:var(--rouge);color:var(--rouge-vif);}
.subs{display:none;flex-direction:column;gap:6px;margin-top:2px;}
.subs.ouvert{display:flex;}
/* la liste n'est plus plafonnee a 5 : jusqu'a 15 propositions. On borne la
   HAUTEUR, pas le nombre, pour que la carte reste tenable sur un telephone. */
.subs.ouvert{max-height:46vh;overflow-y:auto;}
.sub{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;background:var(--noir);
  border:1px solid var(--ligne);width:100%;font-family:inherit;color:var(--texte);cursor:pointer;text-align:left;}
.sub:active{background:var(--surface-haut);}
.sub.actif{border-color:var(--rouge);box-shadow:inset 0 0 0 1px var(--rouge);}
.sub img{width:42px;height:42px;border-radius:6px;object-fit:cover;background:#fff;flex:none;}
.sub .nom{font-size:13px;flex:1;min-width:0;}
.sub .go{font-size:9.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--tres-faible);flex:none;}
.sub.actif .go{color:var(--rouge-vif);}
.bandeau-sub{margin:0 14px 10px;padding:7px 10px;border-radius:7px;background:rgba(200,130,10,.12);
  border-left:2px solid var(--ambre);font-size:11.5px;color:var(--ambre);}
/* enchainement sans repos avec l'exercice du dessus */
.bandeau-sup{margin:0 14px 10px;padding:7px 10px;border-radius:7px;
  background:var(--surface-haut);border-left:2px solid var(--rouge-vif);
  font-size:11.5px;color:var(--faible);}
/* ROPE : conditionnement, rien a saisir */
.rope-go{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;}
.go-rope{appearance:none;width:100%;border:1px solid var(--rouge-vif);
  background:rgba(204,34,0,.12);color:var(--texte);font-size:14.5px;font-weight:700;
  padding:13px 16px;border-radius:9px;cursor:pointer;}
.go-rope:active{background:rgba(204,34,0,.26);}
.rope-note{margin:0;font-size:11.5px;color:var(--tres-faible);}

/* ---------- vignette + loupe ---------- */
.vignette{width:58px;height:58px;flex:none;border-radius:9px;overflow:hidden;border:1px solid var(--ligne);
  background:var(--surface-haut);padding:0;cursor:pointer;position:relative;display:block;transition:transform .12s;}
.vignette:active{transform:scale(.94);}
.vignette img{width:100%;height:100%;object-fit:cover;display:block;background:#fff;}
.vignette .vide{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--tres-faible);font-size:19px;font-weight:800;}
.vignette .loupe-ic{position:absolute;right:3px;bottom:3px;width:15px;height:15px;border-radius:4px;
  background:rgba(18,17,16,.72);color:#fff;font-size:9px;line-height:15px;text-align:center;}
.loupe{position:fixed;inset:0;z-index:25;background:rgba(10,9,8,.96);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:24px max(16px,env(safe-area-inset-left,0px));
  padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));cursor:zoom-out;}
.loupe[hidden]{display:none!important;}
.loupe img{max-width:min(92vw,460px);max-height:64vh;border-radius:12px;background:#fff;object-fit:contain;}
.loupe .nom{font-size:17px;font-weight:600;text-align:center;}
.loupe .fermer-ic{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--tres-faible);}

/* ---------- fin de séance : en bas de page, pas en bandeau fixe ---------- */
.fin{padding:6px 0 10px;}
.fin[hidden]{display:none!important;}
.terminer{width:100%;min-height:54px;border:none;border-radius:11px;background:var(--rouge);color:#fff;
  font-family:inherit;font-size:15px;font-weight:800;letter-spacing:2px;text-transform:uppercase;cursor:pointer;}
.terminer.verrouille{background:var(--surface-haut);color:var(--faible);box-shadow:inset 0 0 0 1px var(--ligne);}

/* chrono : seul élément flottant, la page reste utilisable derrière */
.chrono-zone{position:fixed;left:0;right:0;bottom:0;z-index:12;
  padding:0 max(12px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));
  pointer-events:none;}
.chrono-zone[hidden]{display:none!important;}
.chrono{max-width:460px;margin:0 auto;border-radius:12px;background:var(--surface);
  border:1px solid var(--ligne);overflow:hidden;pointer-events:auto;
  box-shadow:0 6px 22px rgba(0,0,0,.55);}
.ch-barre{height:3px;background:var(--ligne);}
.ch-barre span{display:block;height:100%;background:var(--rouge);width:100%;}
.chrono.fini .ch-barre span{background:var(--rouge-vif);}
.ch-corps{display:flex;align-items:center;gap:10px;padding:9px 11px;}
.ch-temps{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;flex:none;min-width:66px;}
.chrono.fini .ch-temps{color:var(--rouge-vif);animation:battement .55s infinite alternate;}
@keyframes battement{to{opacity:.4;}}
.ch-nom{flex:1;min-width:0;font-size:11px;color:var(--faible);line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ch-corps button{min-height:36px;padding:0 11px;border-radius:8px;border:1px solid var(--ligne);
  background:var(--surface-haut);color:var(--faible);font-family:inherit;font-size:11px;font-weight:700;
  letter-spacing:.8px;text-transform:uppercase;cursor:pointer;flex:none;}

/* ---------- historique / bilan ---------- */
.hist,.bilan{position:fixed;inset:0;z-index:22;background:var(--noir);overflow-y:auto;padding:0 max(16px,env(safe-area-inset-left,0px));}
.hist[hidden],.bilan[hidden]{display:none!important;}
.hist-inner,.bilan-inner{max-width:460px;margin:0 auto;padding-block:38px;padding-bottom:calc(38px + env(safe-area-inset-bottom,0px));}
.hist h2,.bilan h2{font-size:22px;font-weight:800;margin:0 0 3px;}
.hist .st,.bilan .date{font-size:12px;color:var(--faible);margin-bottom:18px;}
.hligne{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ligne);}
.hligne .d{font-size:11px;color:var(--tres-faible);white-space:nowrap;}
.hligne .s{font-size:13.5px;font-variant-numeric:tabular-nums;text-align:right;}
.hligne .t{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ambre);}
.recap{background:var(--surface);border:1px solid var(--ligne);border-radius:12px;padding:14px;margin-bottom:11px;}
.recap h3{font-size:15px;font-weight:600;margin:0 0 8px;}
.recap ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;}
.recap li{display:flex;justify-content:space-between;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--faible);}
.recap li b{color:var(--texte);font-weight:600;}
.chiffres{display:flex;gap:9px;margin-bottom:20px;}
.chiffre{flex:1;min-width:0;background:var(--surface);border:1px solid var(--ligne);border-radius:11px;padding:13px 9px;text-align:center;}
.chiffre b{display:block;font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;}
.chiffre span{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--tres-faible);}
.note{font-size:12.5px;color:var(--faible);line-height:1.55;margin-top:18px;padding-top:16px;border-top:1px solid var(--ligne);}
.fermer{width:100%;min-height:50px;margin-top:18px;border-radius:10px;border:1px solid var(--ligne);
  background:var(--surface);color:var(--faible);font-family:inherit;font-size:13px;font-weight:800;
  letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;}
.msg{padding:60px 0;text-align:center;color:var(--faible);}
.msg h2{font-size:19px;font-weight:600;color:var(--texte);margin:0 0 8px;}
.msg p{margin:0 auto;max-width:300px;font-size:13.5px;line-height:1.6;}
.hors-ligne{display:none;align-items:center;justify-content:center;gap:6px;font-size:10px;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--ambre);padding:6px 0 0;}
body.offline .hors-ligne{display:flex;}
button:focus-visible,input:focus-visible{outline:2px solid var(--rouge-vif);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<div class="page">
  <header class="entete" id="entete" hidden>
    <div class="fil"><span class="pastille"></span><span class="semaine" id="hSemaine"></span></div>
    <h1 class="jour" id="hJour"></h1>
    <div class="sous-jour" id="hSous"></div>
    <div class="hors-ligne" id="hHorsLigne">● Hors ligne — données en cache</div>
    <div class="onglets" id="onglets" role="tablist"></div>
    <div class="barre"><span id="hBarre"></span></div>
  </header>
  <main id="liste"><div class="msg"><h2 id="mChargeT">Chargement…</h2><p id="mChargeP">Récupération de ta séance.</p></div></main>
  <div class="fin" id="fin" hidden>
    <button class="terminer" id="btnTerminer">Terminer la séance</button>
  </div>
</div>

<div class="chrono-zone" id="chronoZone" hidden>
  <div class="chrono" id="chrono">
    <div class="ch-barre"><span id="chBarre"></span></div>
    <div class="ch-corps">
      <span class="ch-temps" id="chTemps">0:00</span>
      <span class="ch-nom" id="chNom"></span>
      <button id="chPlus" type="button">+15s</button>
      <button id="chStop" type="button">✕</button>
    </div>
  </div>
</div>

<div class="hist" id="hist" hidden>
  <div class="hist-inner">
    <h2 id="histNom"></h2>
    <div class="st" id="histSt">Chargement…</div>
    <div id="histListe"></div>
    <button class="fermer" id="histFermer" type="button">Revenir à la séance</button>
  </div>
</div>

<div class="loupe" id="loupe" hidden>
  <img id="loupeImg" alt="">
  <div class="nom" id="loupeNom"></div>
  <div class="fermer-ic" id="loupeFermer">Touche pour fermer</div>
</div>

<div class="bilan" id="bilan" hidden>
  <div class="bilan-inner">
    <h2 id="bTitre">Séance terminée</h2>
    <div class="date" id="bDate"></div>
    <div class="chiffres">
      <div class="chiffre"><b id="bSeries">0</b><span id="lbSeries">Séries</span></div>
      <div class="chiffre"><b id="bVolume">0</b><span id="lbVolume">Tonnage</span></div>
      <div class="chiffre"><b id="bDuree">0</b><span id="lbDuree">Minutes</span></div>
    </div>
    <div id="bRecap"></div>
    <p class="note" id="bNote"></p>
    <button class="fermer" id="bFermer" type="button">Revenir à la séance</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var API = 'https://aghftupaybcffvtzibds.supabase.co/rest/v1/rpc/';
  var CLE_API = 'sb_publishable_vqFJ7bgqNbAtXfFFkAeSTg_diGfjPjz';
  var CIRC = 0;

  var jeton = (location.hash||'').replace(/[^A-Za-z0-9_-]/g,'');
  try{
    if(jeton) localStorage.setItem('seance-jeton',jeton);
    else jeton = localStorage.getItem('seance-jeton') || '';
  }catch(e){}

  var DATA=null, jourActif=0;
  var etat={sets:{},rpe:{},subs:{},unites:{},termine:{},debut:Date.now()};
  var CLE_DATA='seance-data-'+jeton, CLE_ETAT='seance-etat-'+jeton;

  var $=function(id){ return document.getElementById(id); };
  function lire(c){ try{ var v=localStorage.getItem(c); return v?JSON.parse(v):null; }catch(e){ return null; } }
  function ecrire(c,v){ try{ localStorage.setItem(c,JSON.stringify(v)); }catch(e){} }
  function fmt(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2); }
  function cle(j,i,s){ return j+'-'+i+'-'+s; }
  function nb(x){ return (+x).toString(); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }


  // ---------- langue ----------
  // L'app est ecrite en francais ; l'anglais est une surcouche indexee par la
  // phrase francaise. `eleve.lang` vient de `seance_eleve`, mais il arrive
  // APRES le premier dessin : on devine donc au demarrage (langue du
  // telephone, ou le choix retenu la derniere fois), puis le serveur tranche.
  var TRAD_EN = {
    // --- abdos : des DONNEES, d'ou des cles lues dans la base
    "CHAISE ROMAINE":"ROMAN CHAIR",
    "CRUNCH PDC":"BODYWEIGHT CRUNCH",
    "CRUNCH POULIE HAUTE":"HIGH PULLEY CRUNCH",
    "CRUNCH SWISS BALL":"SWISS BALL CRUNCH",
    "CRUNCH SWISS BALL WEIGHTED":"WEIGHTED SWISS BALL CRUNCH",
    "CRUNCH WEIGHTED":"WEIGHTED CRUNCH",
    "MOUNTAIN CLIMBERS":"MOUNTAIN CLIMBERS",
    "OBLIQUE CRUNCH":"OBLIQUE CRUNCH",
    "RELEVE DE JAMBE":"LEG RAISE",
    "RELEVE DE JAMBE INCLINE 45°":"INCLINE LEG RAISE 45°",
    "REVERSE CRUNCH":"REVERSE CRUNCH",
    "abdo:AMRAP 5 min":"As many reps as possible in 5 minutes. Every time you stop, rest 15 to 30 seconds.",
    "abdo:EMOM 5min":"Pick one exercise from the list.\nDo a fixed number of reps at the top of every minute. The rest of the minute is your rest. Repeat several times during the week, on the same exercise or on another one.",
    "abdo:FOR TIME 100 reps":"Pick one exercise and do 100 reps as fast as you can. Time cap: 5 minutes.",
    "abdo:HEAVY ABS":"Pick one exercise, preferably a hard or weighted one, that lets you reach 10 to 30 reps per set.\nDo 3 sets at most, with a full minute of rest between sets.",
    "abdo:PYRAMID 10 / TIME CAP 5min":"Pick one abs exercise; the second one will be mountain climbers.\nExample with floor crunches\nCrunch 1 rep\nMountain climbers 2 reps\nCrunch 2 reps\nMountain climbers 4 reps\nCrunch 3 reps\nMountain climbers 6 reps\nand so on up to 10 crunches\n\nTime cap 5 min: if you cannot finish before that, stop there.\nhttps://raw.githubusercontent.com/SUNIKAI/training-exercise-gifs/main/0630-mountain-climber.gif",
    "abdo:SINGLE SET":"Pick a hard or weighted exercise.\nDo as many reps as you can, to failure.\nWith no rest, go straight into as many floor leg raises as you can.\nWith no rest, finish with as many crunches as you can.\nDone.",
    // --- fin abdos
    'Conditionnement':'Conditioning',
    'Protocole':'Protocol',
    'Consigne':'Instructions',
    'Lancer le chrono':'Start the timer',
    'Rien à saisir sur cet exercice.':'Nothing to log on this one.',
    'Protocole à compléter dans la consigne.':'Protocol missing from the instructions.',
    'Travail':'Work',
    'En superset avec':'Superset with',
    'on enchaîne sans repos.':'no rest in between.',
    'Carnet de séance':'Training sheet',
    'Chargement…':'Loading…',
    'Récupération de ta séance.':'Fetching your session.',
    'Terminer la séance':'Finish session',
    'Séance terminée — voir le bilan':'Session done — see summary',
    'Revenir à la séance':'Back to session',
    'Touche pour fermer':'Tap to close',
    'Séance terminée':'Session done',
    'Séries':'Sets',
    'Tonnage':'Volume',
    'Minutes':'Minutes',
    '● Hors ligne — données en cache':'● Offline — cached data',
    'Semaine':'Week',
    'Première fois':'First time',
    'Lien incomplet':'Incomplete link',
    "Ouvre le lien personnel que ton coach t'a envoyé : il se termine par un code après le #.":
      'Open the personal link your coach sent you: it ends with a code after the #.',
    'Abdos — 5 min':'Abs — 5 min',
    'ta performance':'your result',
    'Modifier':'Edit',
    'Noter':'Log',
    'Trouve ta charge':'Find your weight',
    'Dernière':'Last',
    'Technique':'Technique',
    'Format':'Format',
    'Objectif':'Goal',
    'Dernière fois':'Last time',
    'Note':'Note',
    'Historique':'History',
    'Revenir à':'Back to',
    'Changer encore':'Change again',
    'Faire un autre exercice':'Do another exercise',
    'en cours':'current',
    'choisir':'choose',
    'Voir tout mon historique':'See my full history',
    'exercices':'exercises',
    'séries':'sets',
    'série':'set',
    'sur':'of',
    'montée':'ramp',
    'charge':'weight',
    'Charge série':'Weight, set',
    'Répétitions série':'Reps, set',
    'Valider la série':'Confirm set',
    "RPE de l'exercice":'Exercise RPE',
    'Voir la démonstration de':'Watch the demo for',
    'Repos':'Rest',
    'poids du corps':'bodyweight',
    'reps':'reps',
    'Remplace':'Replaces',
    '— tes séries seront enregistrées sur':'— your sets will be saved under',
    '= toutes les séries':'= all sets',
    "Choisis d\u2019abord un exercice":'Pick an exercise first',
    'Abdos notés':'Abs logged',
    'Enregistrement impossible':'Could not save',
    'Exercice suivant':'Next exercise',
    'Série':'Set',
    'Aucune performance enregistrée.':'No performance recorded yet.',
    'dernière(s) séance(s)':'recent session(s)',
    'Historique indisponible hors ligne.':'History unavailable offline.',
    'Aucune série enregistrée.':'No sets recorded.',
    'Séance introuvable':'Session not found',
    'Impossible de charger les données. Vérifie ta connexion, ou demande un nouveau lien à ton coach.':
      'Could not load your data. Check your connection, or ask your coach for a new link.',
    'Tes séries sont déjà enregistrées : ton coach les voit de son côté. ':
      'Your sets are already saved — your coach can see them. ',
    'Si tu étais hors ligne, elles partiront dès que tu retrouveras du réseau.':
      'If you were offline, they will be sent as soon as you are back online.'
  };
  var LANG='FR', LOC='fr-FR';
  // ?lang=en force la langue et l'emporte sur celle de la fiche : c'est ainsi
  // que le coach regarde la page telle que la voit un eleve anglais.
  var LANG_FORCEE=(/[?&]lang=(fr|en)/i.exec(location.search)||[])[1];
  LANG_FORCEE = LANG_FORCEE ? LANG_FORCEE.toUpperCase() : null;
  try{
    LANG = LANG_FORCEE || localStorage.getItem('seance-lang')
        || ((navigator.language||'').toLowerCase().indexOf('en')===0 ? 'EN' : 'FR');
  }catch(e){ LANG = LANG_FORCEE || 'FR'; }
  function tr(p){ return (LANG==='EN' && TRAD_EN[p]) ? TRAD_EN[p] : p; }
  function trConsigne(t){
    var k='abdo:'+(t.nom||'');
    return (LANG==='EN' && TRAD_EN[k]) ? TRAD_EN[k] : t.description;
  }
  function fixerLangue(l){
    if(LANG_FORCEE) l=LANG_FORCEE;
    LANG=String(l||'FR').toUpperCase()==='EN'?'EN':'FR';
    LOC=LANG==='EN'?'en-GB':'fr-FR';
    try{ localStorage.setItem('seance-lang',LANG); }catch(e){}
    habiller();
  }
  // les libelles qui vivent dans le HTML et non dans une fonction de rendu
  function habiller(){
    LOC=LANG==='EN'?'en-GB':'fr-FR';
    document.documentElement.lang=LANG.toLowerCase();
    document.title=tr('Carnet de séance');
    [['mChargeT','Chargement…'],['mChargeP','Récupération de ta séance.'],
     ['btnTerminer','Terminer la séance'],['histFermer','Revenir à la séance'],
     ['bFermer','Revenir à la séance'],['loupeFermer','Touche pour fermer'],
     ['bTitre','Séance terminée'],['lbSeries','Séries'],['lbVolume','Tonnage'],
     ['lbDuree','Minutes'],['hHorsLigne','● Hors ligne — données en cache']
    ].forEach(function(x){ var e=$(x[0]); if(e) e.textContent=tr(x[1]); });
  }

  function avecRPE(){ return ((DATA&&DATA.planification)||'').toUpperCase().indexOf('CYCLE')>=0; }

  // ---------- conversion d'unité ----------
  // Arrondis pratiques en salle : 2,5 kg et 5 lbs.
  function versKg(v){ return Math.round(v*0.453592/2.5)*2.5; }
  function versLbs(v){ return Math.round(v*2.20462/5)*5; }
  function uniteChoisie(i){
    var u=etat.unites[jourActif+'-'+i];
    return u || uniteDe(exoCourant(i));
  }

  // ---------- exercice effectif (substitution éventuelle) ----------
  function exoEffectif(prevu, idx, i){
    var s=(etat.subs||{})[idx+'-'+i];
    if(!s) return prevu;
    return {exercice_id:s.exercice_id, nom:s.nom, image:s.image, type:s.type,
            series:prevu.series, reps:s.reps||prevu.reps, repos:s.repos||prevu.repos,
            derniere:s.derniere, objectif:null, prescription:null,
            substituts:prevu.substituts, remplace:prevu.nom};
  }
  function exoCourant(i){ return exoEffectif(DATA.jours[jourActif].exos[i], jourActif, i); }

  function derniereDe(exo){ var d=exo.derniere; return (d&&d.series&&d.series.length)?d:null; }
  function prescrit(exo){
    var p=exo.prescription;
    if(!p||!p.objectif) return null;
    var m=p.objectif.match(/([\d.,]+)\s*(kg|lbs)/i);
    if(!m) return null;
    var r=p.objectif.match(/(\d+)\s*\+?\s*reps/i);
    return {charge:+m[1].replace(',','.'), unite:m[2].toLowerCase(), reps:r?r[1]:''};
  }
  // Poids du corps : rien a peser, donc pas de champ de charge ni de bascule
  // KG/LBS. Le type vient de `seance_eleve` ; a defaut on regarde l'unite de la
  // derniere perf, que Notion ecrit « PDC ».
  function estPDC(exo){
    if(String(exo.type||'').toUpperCase()==='PDC') return true;
    var d=exo.derniere;
    return !!(d && String(d.unite||'').toUpperCase()==='PDC');
  }
  function uniteDe(exo){
    var pr=prescrit(exo); if(pr) return pr.unite;
    var d=derniereDe(exo);
    return (d&&d.unite?d.unite:'KG').toLowerCase();
  }
  function texteDerniere(exo){
    var d=derniereDe(exo);
    if(!d) return tr('Première fois');
    var u=(d.unite||'KG').toLowerCase(), g={};
    // au poids du corps, « 0 kg × 15 » n'a aucun sens : on ne montre que les reps
    if(estPDC(exo)) return d.series.map(function(z){ return z.reps; }).join(' · ')+' '+tr('reps');
    d.series.forEach(function(z){ var c=nb(z.charge); (g[c]=g[c]||[]).push(z.reps); });
    return Object.keys(g).map(function(c){ return c+' '+u+' × '+g[c].join('·'); }).join('&nbsp; | &nbsp;');
  }

  // ---------- base ----------
  function appeler(f,args){
    return fetch(API+f,{method:'POST',
      headers:{'apikey':CLE_API,'Authorization':'Bearer '+CLE_API,'Content-Type':'application/json'},
      body:JSON.stringify(args)})
      .then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error(r.status+' '+t); }); return r.json(); });
  }

  if(!jeton){
    $('liste').innerHTML='<div class="msg"><h2>'+tr('Lien incomplet')+'</h2>'+
      '<p>'+tr("Ouvre le lien personnel que ton coach t'a envoyé : il se termine par un code après le #.")+'</p></div>';
    return;
  }

  function envoyer(i){
    var exo=exoCourant(i), faites=[];
    for(var s=0;s<exo.series;s++){
      var v=etat.sets[cle(jourActif,i,s)];
      if(v) faites.push({charge:v.kg, reps:v.reps});
    }
    if(!faites.length) return;
    var envoi={p_jeton:jeton, p_exercice_id:exo.exercice_id, p_series:faites,
               p_unite:uniteChoisie(i).toUpperCase(), p_rpe:etat.rpe[jourActif+'-'+i]||null};
    appeler('enregistrer_perf',envoi).catch(function(){
      var f=lire('seance-file-'+jeton)||[];
      f=f.filter(function(x){ return x.p_exercice_id!==envoi.p_exercice_id; });
      f.push(envoi); ecrire('seance-file-'+jeton,f);
      document.body.classList.add('offline');
    });
  }
  function viderFile(){
    var f=lire('seance-file-'+jeton)||[];
    if(!f.length) return;
    Promise.all(f.map(function(x){ return appeler('enregistrer_perf',x).catch(function(){}); }))
      .then(function(){ ecrire('seance-file-'+jeton,[]); });
  }

  function demarrer(){
    var e=lire(CLE_ETAT);
    if(e&&e.semaine===DATA.semaine) etat=e; else etat={sets:{},rpe:{},subs:{},unites:{},termine:{},debut:Date.now(),semaine:DATA.semaine};
    etat.subs=etat.subs||{}; etat.unites=etat.unites||{}; etat.termine=etat.termine||{};
    etat.semaine=DATA.semaine;
    fixerLangue(DATA.lang);      // le serveur tranche, pas le telephone
    $('entete').hidden=false; $('fin').hidden=false;
    $('hSemaine').textContent=tr('Semaine')+' '+DATA.semaine+(DATA.intensity?' · '+DATA.intensity:'');
    construireOnglets(); afficherJour(jourActif);
  }
  function sauver(){ ecrire(CLE_ETAT,etat); }
  function verrouille(){ return !!etat.termine[jourActif]; }

  function construireOnglets(){
    var o=$('onglets'); o.innerHTML='';
    DATA.jours.forEach(function(j,idx){
      var b=document.createElement('button');
      b.className='onglet'; b.type='button'; b.setAttribute('role','tab');
      b.setAttribute('aria-selected',String(idx===jourActif));
      b.innerHTML='Day '+j.num+'<span class="pt" style="display:'+(etat.termine[idx]?'inline-block':'none')+'"></span>';
      b.addEventListener('click',function(){ jourActif=idx; construireOnglets(); afficherJour(idx); window.scrollTo(0,0); });
      o.appendChild(b);
    });
  }

  // ---------- abdos ----------
  // ABDO est nul tant que le coach n'a pas active les abdos pour cet eleve :
  // dans ce cas on ne dessine rien du tout, pas meme un bloc vide.
  var ABDO=null, abdoChoix={};

  function blocAbdo(jour){
    if(!ABDO||!ABDO.training) return '';
    var dejaFait=(ABDO.faits||{})[String(jour)]||null;
    var choisi=abdoChoix[jour]||(dejaFait&&dejaFait.exercice_id)||'';
    var puces=(ABDO.exercices||[]).map(function(x){
      return '<button class="abdo-x" type="button" data-abdox="'+jour+':'+x.id+'" '+
             'aria-pressed="'+(x.id===choisi)+'"'+
             (x.reminder?' title="'+esc(x.reminder)+'"':'')+'>'+esc(tr(x.nom))+'</button>';
    }).join('');
    return '<section class="abdo'+(dejaFait?' fait':'')+'">'+
      '<div class="abdo-tete"><span class="abdo-sur">'+tr('Abdos — 5 min')+'</span>'+
        '<span class="abdo-nom">'+esc(tr(ABDO.training.nom||''))+'</span></div>'+
      (ABDO.training.description
        ? '<p class="abdo-consigne">'+esc(trConsigne(ABDO.training))+'</p>' : '')+
      '<div class="abdo-choix">'+puces+'</div>'+
      '<div class="abdo-bas">'+
        '<input id="abdoPerf" inputmode="text" placeholder="'+tr('ta performance')+'" '+
          'value="'+esc(dejaFait&&dejaFait.performance||'')+'">'+
        '<button type="button" data-abdook="'+jour+'">'+
          (dejaFait?tr('Modifier'):tr('Noter'))+'</button>'+
      '</div></section>';
  }

  // ---------- carte du coach ----------
  // L'eleve n'a pas besoin de savoir POURQUOI la charge a ete calculee ainsi :
  // il a besoin de la technique, du format, de l'objectif, et de ce qu'il a
  // fait la derniere fois. Le reste etait du bruit.
  function blocCarte(exo,i){
    var p=exo.prescription;
    if(!p){
      return '<div class="carte"><div class="c-charge">'+
             '<span class="c-val" style="font-size:19px">'+tr('Trouve ta charge')+'</span></div>'+
             '<div class="c-detail" style="padding-top:0"><div class="c-ligne">'+
             '<b>'+tr('Dernière')+'</b><span class="v">'+texteDerniere(exo)+'</span></div></div></div>';
    }
    var h='<div class="carte'+(p.cas===1?' test':'')+'">';

    // 1. la technique, avec son schéma. Un clic ouvre son explication.
    var expli=p.philosophie||'';
    var depliable=!!(expli||p.schema_label);
    h+='<button class="c-tete'+(depliable?'':' fixe')+'" type="button"'+
         (depliable?' data-tech="'+i+'" aria-expanded="false"':' disabled')+'>'+
         '<span class="c-tech">'+esc(p.technique||tr('Technique'))+'</span>'+
         (depliable?'<span class="fl">▾</span>':'')+
         (p.schema_svg?'<span class="mini">'+p.schema_svg+'</span>':'')+
       '</button>';
    if(depliable){
      h+='<div class="c-expli" id="tech-'+i+'" hidden>'+esc(expli)+
         (p.schema_label?'<div class="sous">'+esc(p.schema_label)+'</div>':'')+'</div>';
    }

    // 2. le format, en entier et une seule fois
    if(p.format){
      h+='<div class="c-info"><span class="lbl">'+tr('Format')+'</span>'+
         '<span class="v">'+esc(p.format)+'</span></div>';
    }

    // 2bis. la consigne de l'exercice. Visible, et non repliee sous
    // « historique » : quand elle existe, c'est le protocole lui-meme.
    if(p.reminder){
      h+='<div class="c-info"><span class="lbl">'+tr('Consigne')+'</span>'+
         '<span class="v">'+esc(p.reminder)+'</span></div>';
    }

    // 3. l'objectif : la charge en grand, puis le plan des séries en chiffres réels
    var obj='';
    var m=p.objectif?p.objectif.match(/^\s*([\d.,]+)\s*(kg|lbs)\s*(\(([^)]*)\))?\s*(.*)$/i):null;
    if(m){
      obj+='<div class="c-charge">'+
             '<span class="c-val">'+esc(m[1])+'<span class="u">'+esc(m[2].toLowerCase())+'</span></span>'+
             (m[4]?'<span class="c-alt">'+esc(m[4])+'</span>':'')+
             (m[5]?'<span class="c-reps">'+esc(m[5])+'</span>':'')+
           '</div>';
    }else if(p.objectif){
      obj+='<div class="c-charge"><span class="c-val" style="font-size:19px">'+esc(p.objectif)+'</span></div>';
    }
    var sp=p.series_prescrites||[];
    if(sp.length>1){
      var chips='';
      sp.forEach(function(r){
        chips+='<span class="chip'+(r.role!=='travail'?' rampe':'')+'">'+nb(r.charge)+'</span>';
      });
      obj+='<div class="c-plan"><span class="lbl">'+tr('Séries')+'</span>'+chips+'</div>';
    }
    if(obj) h+='<div class="c-info c-obj"><span class="lbl">'+tr('Objectif')+'</span>'+obj+'</div>';

    // 4. l'historique, replié
    var det='<div class="c-ligne"><b>'+tr('Dernière fois')+'</b><span class="v">'+
            (p.derniere?esc(p.derniere):texteDerniere(exo))+'</span></div>';

    h+='<button class="c-plus" type="button" data-detail="'+i+'">'+tr('Historique')+' ▾</button>'+
       '<div class="c-detail" id="detail-'+i+'" hidden>'+det+'</div>';
    return h+'</div>';
  }

  // ---------- ROPE : conditionnement, rien a saisir ----------
  // Meme syntaxe que prescrire.py : « 2min/1min x5 », « 90s/30s x8 ».
  // Elle vit dans la consigne de l exercice : c est le seul endroit a changer.
  function estRope(exo){
    var m=(exo.prescription&&exo.prescription.mode)||'';
    return String(m).toUpperCase()==='ROPE'
        || String(exo.type||'').toUpperCase()==='ROPE';
  }
  function secondes(txt){
    var t=String(txt||'').toLowerCase().replace(/\s+/g,'');
    var m=t.match(/^(\d+)(?:min|mn|m)(\d{1,2})$/);
    if(m) return (+m[1])*60+(+m[2]);
    m=t.match(/^(\d+(?:[.,]\d+)?)(min|mn|m|sec|s)?$/);
    if(!m) return null;
    var v=parseFloat(m[1].replace(',','.')), u=m[2]||'s';
    return Math.round(v*(u.charAt(0)==='m'?60:1));
  }
  function protocoleRope(exo){
    var src=(exo.prescription&&exo.prescription.reminder)||'';
    var m=String(src).match(/^\s*([0-9a-z.,\s]+?)\s*\/\s*([0-9a-z.,\s]+?)\s*[x*]\s*(\d+)/i);
    if(!m) return null;
    var t=secondes(m[1]), r=secondes(m[2]), n=+m[3];
    if(!t||r===null||!n) return null;
    return {travail:t, repos:r, tours:n, fin:m[0].length};
  }
  function phasesRope(exo){
    var p=protocoleRope(exo); if(!p) return [];
    var out=[];
    for(var k=1;k<=p.tours;k++){
      out.push({sec:p.travail, libelle:tr('Travail')+' '+k+'/'+p.tours});
      if(p.repos>0 && k<p.tours)
        out.push({sec:p.repos, libelle:tr('Repos')+' '+k+'/'+p.tours});
    }
    return out;
  }
  function blocRope(exo,i){
    var p=exo.prescription||{}, pr=protocoleRope(exo);
    // le protocole est deja ecrit en clair dans « format » : on ne garde de
    // la consigne que ce qu'elle ajoute
    var reste=String(p.reminder||'');
    reste=(pr?reste.slice(pr.fin):reste).trim();
    var vignette = exo.image
      ? '<button class="vignette" type="button" data-gif="'+i+'" aria-label="'+tr('Voir la démonstration de')+' '+esc(exo.nom)+'">'+
          '<img loading="lazy" decoding="async" src="'+esc(exo.image)+'" alt=""><span class="loupe-ic">⤢</span></button>'
      : '<span class="vignette"><span class="vide">—</span></span>';
    return '<article class="exo rope" id="exo-'+i+'">'+
      '<div class="exo-tete"><span class="num">'+(i+1)+'</span><div class="exo-titres">'+
        '<h2 class="exo-nom">'+esc(exo.nom)+'</h2>'+
        '<div class="meta"><span class="tag">'+tr('Conditionnement')+'</span></div>'+
      '</div>'+vignette+'</div>'+
      '<div class="carte">'+
        (p.format?'<div class="c-info"><span class="lbl">'+tr('Protocole')+'</span>'+
                  '<span class="v">'+esc(p.format)+'</span></div>':'')+
        (reste?'<div class="c-info"><span class="lbl">'+tr('Consigne')+'</span>'+
               '<span class="v">'+esc(reste)+'</span></div>':'')+
      '</div>'+
      '<div class="rope-go">'+
        (pr?'<button class="go-rope" type="button" data-rope="'+i+'">▶ '+tr('Lancer le chrono')+'</button>'
           :'<p class="rope-note">'+tr('Protocole à compléter dans la consigne.')+'</p>')+
        '<p class="rope-note">'+tr('Rien à saisir sur cet exercice.')+'</p>'+
      '</div></article>';
  }
  // SUPERSET porte sur la LIGNE de programme : on lit donc le mode de
  // l'exercice prevu, pas celui d'un eventuel substitut.
  //
  // `prevu.mode` vient de la ligne de programme et vaut par JOUR : c'est lui
  // qui fait foi. Le mode de la prescription, lui, est par EXERCICE — il ne
  // sert que de repli tant que seance_mode.sql n'est pas applique.
  function blocSuperset(prevu,idx,i){
    var m=prevu.mode||(prevu.prescription&&prevu.prescription.mode)||'';
    if(String(m).toUpperCase()!=='SUPERSET' || i===0) return '';
    var av=DATA.jours[idx].exos[i-1];
    var nom=av?exoEffectif(av,idx,i-1).nom:'';
    return '<div class="bandeau-sup">⇄ '+tr('En superset avec')+
           (nom?' <b>'+esc(nom)+'</b>':'')+' — '+tr('on enchaîne sans repos.')+'</div>';
  }

  function blocOutils(prevu,i,exo){
    var h='<div class="outils">';
    if(exo.remplace) h+='<button class="outil retour" type="button" data-retour="'+i+'">↩ '+tr('Revenir à')+' '+esc(exo.remplace)+'</button>';
    if(prevu.substituts&&prevu.substituts.length){
      h+='<button class="outil" type="button" data-subs="'+i+'">'+(exo.remplace?tr('Changer encore'):tr('Faire un autre exercice'))+' ▾</button>'+
         '<div class="subs" id="subs-'+i+'">';
      prevu.substituts.forEach(function(s,k){
        var actif=(s.exercice_id===exo.exercice_id);
        h+='<button class="sub'+(actif?' actif':'')+'" type="button" data-choisir="'+i+'" data-k="'+k+'">'+
             (s.image?'<img loading="lazy" src="'+esc(s.image)+'" alt="">':'<img alt="">')+
             '<span class="nom">'+esc(s.nom)+'</span><span class="go">'+(actif?tr('en cours'):tr('choisir'))+'</span></button>';
      });
      h+='</div>';
    }
    h+='<button class="outil" type="button" data-hist="'+i+'">'+tr('Voir tout mon historique')+' →</button></div>';
    return h;
  }

  // ---------- rendu d'un jour ----------
  function afficherJour(idx){
    var j=DATA.jours[idx];
    var nbs=j.exos.reduce(function(a,e){return a+(estRope(e)?0:e.series);},0);
    $('hJour').textContent='Day '+j.num+' — '+j.titre;
    $('hSous').textContent=DATA.eleve+' · '+j.exos.length+' '+tr('exercices')+
                           ' · '+nbs+' '+tr('séries');

    var html='';
    if(etat.termine[idx]){
      var t=etat.termine[idx];
      html+='<div class="verrou"><span class="ok">✓</span><div class="txt">'+
            '<div class="t">'+tr('Séance terminée')+'</div><div class="d">'+esc(t.libelle||'')+'</div></div>'+
            '<button type="button" id="btnModifier">'+tr('Modifier')+'</button></div>';
    }

    j.exos.forEach(function(prevu,i){
      var exo=exoEffectif(prevu,idx,i);
      if(estRope(exo)){ html+=blocRope(exo,i); return; }
      var un=uniteChoisie(i);
      var sp=(exo.prescription&&exo.prescription.series_prescrites)||null;
      var pdc=estPDC(exo);
      var ROLE={rampe:tr('montée'),backoff:'back-off',travail:''};
      var series='';
      for(var s=0;s<exo.series;s++){
        var v=etat.sets[cle(idx,i,s)];
        var cons=sp&&sp[s]?sp[s]:null;
        var rol=cons?(ROLE[cons.role]||''):'';
        // volontairement VIDE : la charge n'est plus pré-remplie, elle est suggérée
        series+='<div class="serie'+(v?' ok':'')+(cons&&cons.role==='rampe'?' rampe':'')+(pdc?' pdc':'')+'" data-exo="'+i+'" data-serie="'+s+'">'+
          '<span class="serie-num">S'+(s+1)+(rol?'<span class="serie-role">'+rol+'</span>':'')+'</span>'+
          (pdc ? '' :
          '<label class="champ"><input data-champ="kg" data-exo="'+i+'" data-serie="'+s+'" inputmode="decimal" '+
            'placeholder="'+tr('charge')+'" aria-label="'+tr('Charge série')+' '+(s+1)+'" value="'+(v?v.kg:'')+'">'+
            '<span class="unite">'+un+'</span></label>')+
          '<label class="champ"><input data-champ="reps" data-exo="'+i+'" data-serie="'+s+'" inputmode="numeric" '+
            'placeholder="reps" aria-label="'+tr('Répétitions série')+' '+(s+1)+'" value="'+(v?v.reps:'')+'">'+
            '<span class="unite">reps</span></label>'+
          '<button class="valider" type="button" data-valide aria-label="'+tr('Valider la série')+' '+(s+1)+'">✓</button>'+
        '</div>';
      }

      var rpe='';
      if(avecRPE()){
        rpe='<div class="rpe"><div class="rpe-label">'+tr("RPE de l'exercice")+'</div><div class="rpe-choix">';
        [10,9,8,7,5].forEach(function(v){
          rpe+='<button type="button" data-rpe="'+v+'" data-exo="'+i+'" aria-pressed="'+(etat.rpe[idx+'-'+i]===v)+'">'+v+'</button>';
        });
        rpe+='</div></div>';
      }

      var vignette = exo.image
        ? '<button class="vignette" type="button" data-gif="'+i+'" aria-label="'+tr('Voir la démonstration de')+' '+esc(exo.nom)+'">'+
            '<img loading="lazy" decoding="async" src="'+esc(exo.image)+'" alt=""><span class="loupe-ic">⤢</span></button>'
        : '<span class="vignette"><span class="vide">—</span></span>';

      html+='<article class="exo" id="exo-'+i+'">'+
        '<div class="exo-tete"><span class="num">'+(i+1)+'</span><div class="exo-titres">'+
          '<h2 class="exo-nom">'+esc(exo.nom)+'</h2><div class="meta">'+
            // le format est dans la carte, juste dessous : ne pas le répéter ici
            '<button class="tag repos" type="button" data-repos="'+i+'">⏱ '+tr('Repos')+' '+fmt(exo.repos)+'</button>'+
            (pdc ? '<span class="tag pdc-tag">'+tr('poids du corps')+'</span>' :
            '<span class="unite-bascule">'+
              '<button type="button" data-unite="kg" data-exo="'+i+'" aria-pressed="'+(un==='kg')+'">KG</button>'+
              '<button type="button" data-unite="lbs" data-exo="'+i+'" aria-pressed="'+(un==='lbs')+'">LBS</button>'+
            '</span>')+
        '</div></div>'+vignette+'</div>'+
        (exo.remplace?'<div class="bandeau-sub">'+tr('Remplace')+' <b>'+esc(exo.remplace)+'</b> '+tr('— tes séries seront enregistrées sur')+' '+esc(exo.nom)+'.</div>':'')+
        blocSuperset(prevu,idx,i)+
        blocCarte(exo,i)+
        '<div class="series">'+series+'</div>'+rpe+blocOutils(prevu,i,exo)+'</article>';
    });

    html+=blocAbdo(j.num);

    $('liste').innerHTML=html;
    $('liste').classList.toggle('jour-verrouille',!!etat.termine[idx]);
    var bm=$('btnModifier');
    if(bm) bm.addEventListener('click',function(){ delete etat.termine[idx]; sauver(); afficherJour(idx); construireOnglets(); });
    majProgression();
  }

  // ---------- aide à la saisie ----------
  function fermerAide(){
    var a=document.querySelector('.aide'); if(a) a.remove();
  }
  function ouvrirAide(input){
    fermerAide();
    if(verrouille()) return;
    var i=+input.dataset.exo, s=+input.dataset.serie, type=input.dataset.champ;
    var exo=exoCourant(i);
    var sp=(exo.prescription&&exo.prescription.series_prescrites)||null;
    var cons=sp&&sp[s]?sp[s]:null;
    var valeurs=[], cible=null;

    if(type==='kg'){
      var un=uniteChoisie(i), pas=(un==='lbs')?5:2.5;
      var base=cons?+cons.charge:((prescrit(exo)||{}).charge||0);
      if(base&&uniteDe(exo)!==un) base=(un==='lbs')?versLbs(base):versKg(base);
      if(!base){
        var d=derniereDe(exo);
        if(d) base=Math.max.apply(null,d.series.map(function(z){return +z.charge;}));
      }
      if(!base) return;
      cible=base;
      valeurs=[base-2*pas,base-pas,base,base+pas,base+2*pas].filter(function(v){return v>0;});
    }else{
      var r=(exo.reps||'').match(/(\d+)\s*-\s*(\d+)/);
      var min=r?+r[1]:((prescrit(exo)||{}).reps||8), max=r?+r[2]:min+2;
      cible=min;
      for(var v=min;v<=max+2;v++) valeurs.push(v);
      valeurs=valeurs.slice(0,6);
    }

    var html='';
    valeurs.forEach(function(v){
      html+='<button type="button" data-pose="'+v+'" class="'+(v===cible?'cible':'')+'">'+nb(v)+'</button>';
    });
    html+='<button type="button" data-toutes="1" class="toutes">'+tr('= toutes les séries')+'</button>';
    var div=document.createElement('div');
    div.className='aide'; div.dataset.exo=i; div.dataset.serie=s; div.dataset.type=type;
    div.innerHTML=html;
    input.closest('.serie').insertAdjacentElement('afterend',div);
  }

  function champ(i,s,type){
    return document.querySelector('input[data-champ="'+type+'"][data-exo="'+i+'"][data-serie="'+s+'"]');
  }

  // ---------- interactions ----------
  $('liste').addEventListener('focusin',function(ev){
    var inp=ev.target.closest('input[data-champ]');
    if(inp){ ouvrirAide(inp); return; }
    // ne pas fermer quand le focus part DANS l'aide : sinon elle disparaît
    // avant que le clic n'ait eu lieu, et le bouton ne sert à rien.
    if(ev.target.closest('.aide')) return;
    fermerAide();
  });
  // garde le champ actif pendant qu'on touche un bouton d'aide
  $('liste').addEventListener('pointerdown',function(ev){
    if(ev.target.closest('.aide')) ev.preventDefault();
  });

  $('liste').addEventListener('click',function(ev){
    var a=ev.target.closest('.aide button');
    if(a){
      var box=a.closest('.aide'), i=+box.dataset.exo, s=+box.dataset.serie, type=box.dataset.type;
      var exo=exoCourant(i);
      if(a.dataset.toutes){
        var src=champ(i,s,type).value;
        for(var k=0;k<exo.series;k++){ var c=champ(i,k,type); if(c) c.value=src; }
      }else{
        champ(i,s,type).value=a.dataset.pose;
      }
      fermerAide();
      return;
    }
    var tc=ev.target.closest('[data-tech]');
    if(tc){
      var bt=$('tech-'+tc.dataset.tech), ouvre=bt.hidden;
      bt.hidden=!ouvre;
      tc.setAttribute('aria-expanded',ouvre?'true':'false');
      var f=tc.querySelector('.fl'); if(f) f.textContent=ouvre?'▴':'▾';
      return;
    }
    var dt=ev.target.closest('[data-detail]');
    if(dt){
      var box=$('detail-'+dt.dataset.detail), ouv=box.hidden;
      box.hidden=!ouv;
      dt.textContent=dt.textContent.replace(ouv?'▾':'▴', ouv?'▴':'▾');
      return;
    }
    var ax=ev.target.closest('[data-abdox]');
    if(ax){
      var pa=ax.dataset.abdox.split(':');
      abdoChoix[pa[0]]=pa[1];
      var zone=ax.parentNode.querySelectorAll('[data-abdox]');
      for(var k=0;k<zone.length;k++){
        zone[k].setAttribute('aria-pressed', zone[k]===ax?'true':'false');
      }
      return;
    }
    var ao=ev.target.closest('[data-abdook]');
    if(ao){
      var jr=ao.dataset.abdook, exo=abdoChoix[jr];
      var champ=$('abdoPerf'), perf=champ?champ.value.trim():'';
      if(!exo){ toast(tr('Choisis d\u2019abord un exercice')); return; }
      ao.disabled=true;
      appeler('enregistrer_abdo',{p_jeton:jeton,p_jour:+jr,
                                  p_exercice_id:exo,p_performance:perf})
        .then(function(){
          ABDO.faits=ABDO.faits||{};
          ABDO.faits[String(jr)]={exercice_id:exo,performance:perf};
          ao.disabled=false; toast(tr('Abdos notés'));
          afficherJour(jourActif);
        })
        .catch(function(){ ao.disabled=false; toast(tr('Enregistrement impossible')); });
      return;
    }
    var u=ev.target.closest('[data-unite]');
    if(u){ changerUnite(+u.dataset.exo, u.dataset.unite); return; }
    var rp=ev.target.closest('[data-repos]');
    if(rp){ var e=exoCourant(+rp.dataset.repos); lancerRepos(e.repos, e.nom, tr('Repos')); return; }
    var rc=ev.target.closest('[data-rope]');
    if(rc){ var ex=exoCourant(+rc.dataset.rope);
            lancerIntervalles(phasesRope(ex), ex.nom); return; }
    var g=ev.target.closest('[data-gif]');
    if(g){ ouvrirLoupe(+g.dataset.gif); return; }
    var sb=ev.target.closest('[data-subs]');
    if(sb){ var bl=$('subs-'+sb.dataset.subs), ouv=bl.classList.toggle('ouvert');
            sb.textContent=tr('Faire un autre exercice')+' '+(ouv?'▴':'▾'); return; }
    var ch=ev.target.closest('[data-choisir]');
    if(ch){ basculerVers(+ch.dataset.choisir,+ch.dataset.k); return; }
    var rt=ev.target.closest('[data-retour]');
    if(rt){ basculerVers(+rt.dataset.retour,null); return; }
    var hb=ev.target.closest('[data-hist]');
    if(hb){ ouvrirHistorique(+hb.dataset.hist); return; }
    var b=ev.target.closest('[data-valide]');
    if(b){ validerSerie(b.closest('.serie')); return; }
    var r=ev.target.closest('[data-rpe]');
    if(r){
      var k2=jourActif+'-'+r.dataset.exo, v2=+r.dataset.rpe;
      etat.rpe[k2]=(etat.rpe[k2]===v2?null:v2); sauver();
      [].forEach.call(r.parentNode.children,function(x){ x.setAttribute('aria-pressed',String(+x.dataset.rpe===etat.rpe[k2])); });
      envoyer(+r.dataset.exo);
    }
  });

  function changerUnite(i,vers){
    var c=jourActif+'-'+i, avant=uniteChoisie(i);
    if(avant===vers) return;
    etat.unites[c]=vers;
    var exo=exoCourant(i);
    // convertir ce qui est déjà saisi, validé ou non
    for(var s=0;s<exo.series;s++){
      var inp=champ(i,s,'kg');
      if(inp&&inp.value){ inp.value=nb(vers==='lbs'?versLbs(+inp.value):versKg(+inp.value)); }
      var k=cle(jourActif,i,s);
      if(etat.sets[k]) etat.sets[k].kg = vers==='lbs'?versLbs(etat.sets[k].kg):versKg(etat.sets[k].kg);
    }
    sauver(); afficherJour(jourActif); envoyer(i);
  }

  function validerSerie(ligne){
    if(verrouille()) return;
    var i=+ligne.dataset.exo, s=+ligne.dataset.serie, k=cle(jourActif,i,s);
    var exo=exoCourant(i);
    reveiller(); fermerAide();
    if(etat.sets[k]){ delete etat.sets[k]; ligne.classList.remove('ok'); }
    else{
      // au poids du corps le champ n'existe pas : la charge vaut 0
      var chKg=champ(i,s,'kg');
      var kg=chKg?(parseFloat(chKg.value)||0):0;
      var reps=parseInt(champ(i,s,'reps').value,10)||0;
      if(!reps){ champ(i,s,'reps').focus(); return; }
      etat.sets[k]={kg:kg,reps:reps};
      ligne.classList.add('ok');
      try{ if(navigator.vibrate) navigator.vibrate(35); }catch(e){}
      lancerRepos(exo.repos, exo.nom, (s===exo.series-1)?tr('Exercice suivant')
                                                 :tr('Série')+' '+(s+2));
    }
    sauver(); majProgression(); envoyer(i);
  }

  function majProgression(){
    var j=DATA.jours[jourActif];
    var total=j.exos.reduce(function(a,e){return a+(estRope(e)?0:e.series);},0), faits=0;
    j.exos.forEach(function(exo,i){
      var n=0;
      for(var s=0;s<exo.series;s++){ if(etat.sets[cle(jourActif,i,s)]){n++;faits++;} }
      var el=$('exo-'+i); if(el) el.classList.toggle('fait',n===exo.series);
    });
    $('hBarre').style.width=(total?faits/total*100:0)+'%';
    var t=$('btnTerminer');
    t.textContent = verrouille()?tr('Séance terminée — voir le bilan')
                               :tr('Terminer la séance');
    t.classList.toggle('verrouille',verrouille());
  }

  function basculerVers(i,k){
    if(verrouille()) return;
    var prevu=DATA.jours[jourActif].exos[i], c=jourActif+'-'+i;
    for(var s=0;s<prevu.series;s++) delete etat.sets[cle(jourActif,i,s)];
    delete etat.rpe[c]; delete etat.unites[c];
    if(k===null) delete etat.subs[c]; else etat.subs[c]=prevu.substituts[k];
    sauver(); afficherJour(jourActif); construireOnglets();
    var el=$('exo-'+i); if(el) el.scrollIntoView({block:'start'});
  }

  // ---------- historique ----------
  function ouvrirHistorique(i){
    var exo=exoCourant(i);
    $('histNom').textContent=exo.nom; $('histSt').textContent=tr('Chargement…'); $('histListe').innerHTML='';
    $('hist').hidden=false; window.scrollTo(0,0);
    appeler('historique_exercice',{p_jeton:jeton,p_exercice_id:exo.exercice_id,p_limite:15})
      .then(function(rows){
        if(!rows.length){ $('histSt').textContent=tr('Aucune performance enregistrée.'); return; }
        $('histSt').textContent=rows.length+' '+tr('dernière(s) séance(s)');
        $('histListe').innerHTML=rows.map(function(p){
          var s=(p.series||[]).map(function(z){ return nb(z.charge)+'×'+z.reps; }).join(' · ');
          var d=new Date(p.date).toLocaleDateString(LOC,{day:'2-digit',month:'short'});
          return '<div class="hligne"><span class="d">'+d+(p.rpe?' · RPE '+nb(p.rpe):'')+'</span>'+
                 '<span class="s">'+esc(s)+' <small>'+(p.unite||'').toLowerCase()+'</small>'+
                 (p.technique?'<div class="t">'+esc(p.technique)+'</div>':'')+'</span></div>';
        }).join('');
      })
      .catch(function(){ $('histSt').textContent=tr('Historique indisponible hors ligne.'); });
  }
  $('histFermer').addEventListener('click',function(){ $('hist').hidden=true; });

  // ---------- loupe ----------
  function ouvrirLoupe(i){
    var exo=exoCourant(i);
    if(!exo.image) return;
    $('loupeImg').src=exo.image; $('loupeNom').textContent=exo.nom; $('loupe').hidden=false;
  }
  $('loupe').addEventListener('click',function(){ $('loupe').hidden=true; $('loupeImg').removeAttribute('src'); });

  // ---------- chrono flottant ----------
  var total=0, finAt=0, raf=null, fini=false, audio=null, verrou=null;
  // chrono a intervalles (ROPE) : les phases qui restent a enchainer
  var file=[], nomSeq='';
  function lancerRepos(sec,nom,suite){ file=[]; _chrono(sec,nom,suite); }
  function lancerIntervalles(phases,nom){
    if(!phases||!phases.length) return;
    file=phases.slice(); nomSeq=nom; reveiller(); phaseSuivante();
  }
  function phaseSuivante(){
    var p=file.shift();
    if(p) _chrono(p.sec,nomSeq,p.libelle);
  }
  function _chrono(sec,nom,suite){
    if(!sec) return;
    total=sec; finAt=Date.now()+sec*1000; fini=false;
    $('chNom').textContent=nom+(suite?' · '+suite:'');
    $('chronoZone').hidden=false; $('chrono').classList.remove('fini');
    document.body.classList.add('chrono-actif');
    garderEcran(); boucle();
  }
  function restant(){ return Math.max(0,finAt-Date.now()); }
  function boucle(){
    var ms=restant();
    $('chTemps').textContent=fmt(Math.ceil(ms/1000));
    $('chBarre').style.width=(total>0?(ms/(total*1000))*100:0)+'%';
    if(ms<=0){ if(!fini){ fini=true; $('chrono').classList.add('fini'); sonner();
      try{ if(navigator.vibrate) navigator.vibrate([220,110,220,110,400]); }catch(e){} }
      if(file.length) phaseSuivante();
      return; }
    raf=requestAnimationFrame(boucle);
  }
  function arreterRepos(){ file=[]; $('chronoZone').hidden=true; document.body.classList.remove('chrono-actif');
    if(raf) cancelAnimationFrame(raf); relacherEcran(); }
  $('chStop').addEventListener('click',arreterRepos);
  $('chPlus').addEventListener('click',function(){
    reveiller(); finAt+=15000; total=Math.max(total,Math.ceil(restant()/1000));
    if(fini){ fini=false; $('chrono').classList.remove('fini'); } boucle();
  });
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible' && !$('chronoZone').hidden){
      if(restant()>0){ garderEcran(); boucle(); } else if(!fini){ fini=true; $('chrono').classList.add('fini'); }
    }
  });
  function reveiller(){
    try{ if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)();
         if(audio.state==='suspended') audio.resume(); }catch(e){}
  }
  function sonner(){
    try{
      if(!audio) return;
      [0,0.42,0.84].forEach(function(t){
        var o=audio.createOscillator(), g=audio.createGain();
        o.connect(g); g.connect(audio.destination); o.frequency.value=880; o.type='sine';
        g.gain.setValueAtTime(0.0001,audio.currentTime+t);
        g.gain.exponentialRampToValueAtTime(0.32,audio.currentTime+t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,audio.currentTime+t+0.32);
        o.start(audio.currentTime+t); o.stop(audio.currentTime+t+0.36);
      });
    }catch(e){}
  }
  function garderEcran(){
    if(!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function(v){ verrou=v; }).catch(function(){});
  }
  function relacherEcran(){ if(verrou){ try{ verrou.release(); }catch(e){} verrou=null; } }

  // ---------- terminer / bilan ----------
  $('btnTerminer').addEventListener('click',function(){
    var j=DATA.jours[jourActif], series=0, volume=0, recap='';
    j.exos.forEach(function(prevu,i){
      var exo=exoCourant(i), li='', n=0, un=uniteChoisie(i);
      for(var s=0;s<exo.series;s++){
        var v=etat.sets[cle(jourActif,i,s)];
        if(!v) continue;
        n++; series++; volume+=v.kg*v.reps;
        li+='<li><span>'+tr('Série')+' '+(s+1)+'</span><b>'+
            (estPDC(exo) ? v.reps+' '+tr('reps') : v.kg+' '+un+' × '+v.reps)+'</b></li>';
      }
      if(!n) return;
      var r=etat.rpe[jourActif+'-'+i];
      recap+='<div class="recap"><h3>'+esc(exo.nom)+(r?' · RPE '+r:'')+'</h3><ul>'+li+'</ul></div>';
    });
    var total=j.exos.reduce(function(a,e){return a+(estRope(e)?0:e.series);},0);
    if(!etat.termine[jourActif]){
      etat.termine[jourActif]={quand:Date.now(),
        libelle:series+' '+tr(series>1?'séries':'série')+' '+tr('sur')+' '+total+' · '+new Date().toLocaleDateString(LOC,{day:'2-digit',month:'long'})};
      sauver(); construireOnglets(); afficherJour(jourActif);
    }
    $('bSeries').textContent=series;
    $('bVolume').textContent=Math.round(volume).toLocaleString(LOC);
    $('bDuree').textContent=Math.max(1,Math.round((Date.now()-(etat.debut||Date.now()))/60000));
    $('bRecap').innerHTML=recap||'<p class="note">'+tr('Aucune série enregistrée.')+'</p>';
    $('bDate').textContent=new Date().toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'long'});
    $('bNote').textContent=tr('Tes séries sont déjà enregistrées : ton coach les voit de son côté. ')
      +tr('Si tu étais hors ligne, elles partiront dès que tu retrouveras du réseau.');
    arreterRepos();
    $('bilan').hidden=false; window.scrollTo(0,0);
  });
  $('bFermer').addEventListener('click',function(){ $('bilan').hidden=true; });

  window.addEventListener('online',function(){ document.body.classList.remove('offline'); viderFile(); });
  window.addEventListener('offline',function(){ document.body.classList.add('offline'); });

  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }

  // ---------- chargement ----------
  // EN DERNIER : dessiner la page appelle des constantes déclarées plus haut
  // (CAS, helpers). Lancer le rendu avant leur affectation casse tout.
  habiller();          // la langue devinee, en attendant le serveur
  var cache=lire(CLE_DATA);
  if(cache){ DATA=cache; demarrer(); }
  // le bloc abdo se charge a part : s'il echoue, la seance s'affiche quand meme
  appeler('abdo_semaine',{p_jeton:jeton})
    .then(function(a){ ABDO=a; if(DATA) afficherJour(jourActif); })
    .catch(function(){});

  appeler('seance_eleve',{p_jeton:jeton})
    .then(function(d){ DATA=d; ecrire(CLE_DATA,d); document.body.classList.remove('offline'); demarrer(); viderFile(); })
    .catch(function(){
      if(DATA){ document.body.classList.add('offline'); return; }
      $('liste').innerHTML='<div class="msg"><h2>'+tr('Séance introuvable')+'</h2>'+
        '<p>'+tr('Impossible de charger les données. Vérifie ta connexion, ou demande un nouveau lien à ton coach.')+'</p></div>';
    });
})();
</script>
</body>
</html>
