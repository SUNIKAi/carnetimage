<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@700;800&display=swap" rel="stylesheet">
<title>Repos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1A1A1A;display:flex;justify-content:center;align-items:center;
     min-height:100vh;font-family:'Kanit',Arial,sans-serif;}
.wrap{display:flex;align-items:center;gap:12px;}
.disp{font-size:42px;font-weight:800;color:#FFFFFF;letter-spacing:-1px;
      min-width:80px;text-align:center;transition:color .3s;}
.disp.done{color:#CC2200;animation:pulse 0.4s infinite alternate;}
@keyframes pulse{to{opacity:0.4;}}
.btns{display:flex;gap:6px;}
button{font-family:'Kanit',sans-serif;font-size:11px;font-weight:700;
       letter-spacing:1px;border:none;border-radius:5px;padding:7px 12px;
       cursor:pointer;text-transform:uppercase;transition:opacity .2s;}
button:active{opacity:0.7;}
#btn-main{background:#CC2200;color:#fff;}
#btn-reset{background:#2A2A2A;color:#666;border:1px solid #333;}
</style>
</head>
<body>
<div class="wrap">
  <div class="disp" id="disp">0:00</div>
  <div class="btns">
    <button id="btn-main" onclick="toggle()">START</button>
    <button id="btn-reset" onclick="resetTimer()">RESET</button>
  </div>
</div>
<script>
var params=new URLSearchParams(location.search);
var total=parseInt(params.get('t')||'120',10);
var rem=total,iv=null,running=false;
var disp=document.getElementById('disp');
var btnM=document.getElementById('btn-main');
function fmt(s){return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);}
function draw(){disp.textContent=fmt(rem);disp.classList.toggle('done',rem===0);}
function toggle(){
  if(rem===0){resetTimer();return;}
  if(running){clearInterval(iv);running=false;btnM.textContent='RESUME';btnM.style.background='#884400';}
  else{running=true;btnM.textContent='PAUSE';btnM.style.background='#CC2200';
    iv=setInterval(function(){
      if(rem>0){rem--;draw();}
      else{clearInterval(iv);running=false;btnM.textContent='START';beep();}
    },1000);}
}
function resetTimer(){clearInterval(iv);running=false;rem=total;draw();btnM.textContent='START';btnM.style.background='#CC2200';}
function beep(){
  try{var ctx=new(window.AudioContext||window.webkitAudioContext)();
    [0,0.4,0.8].forEach(function(t){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);o.frequency.value=880;
      g.gain.setValueAtTime(0.4,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.3);
      o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+0.35);
    });}catch(e){}
}
draw();
</script>
</body>
</html>
